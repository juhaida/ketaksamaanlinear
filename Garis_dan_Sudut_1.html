<head>

<title>Garis dan Sudut 1</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#18232d;--muted:#667481;--primary:#145da0;--good:#18794e;--bad:#c62828;--line:#dce6ef}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#145da0,#0c3d68);color:#fff;border-radius:18px;padding:18px}
.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label.title{font-weight:800;font-size:.88rem;display:block;margin-bottom:5px}
select,input[type=number],input[type=text]{width:100%;padding:11px;border:1px solid #cbd7e2;border-radius:10px;font-size:1rem;background:#fff}
.qhead{font-weight:900}.diagram{display:flex;justify-content:center}.diagram img{display:block;width:auto;max-width:82%;height:auto;max-height:175px;object-fit:contain;background:#fff;margin:4px auto 6px}
.answer-row{display:grid;grid-template-columns:1fr 160px;gap:10px;align-items:center}.degree-input{display:flex;gap:5px;align-items:center}.degree-input input{text-align:center;font-weight:800}.degree{font-size:1.2rem;font-weight:800}
.guide{border:1px solid #b9d7ee;background:#f2f9fe;border-radius:10px;padding:8px 10px}.guide summary{font-weight:800;color:#0c4f82;cursor:pointer}
button{width:100%;padding:12px;border:none;border-radius:11px;background:#145da0;color:#fff;font-weight:900;font-size:1rem;cursor:pointer}.secondary{background:#687986}
.result{text-align:center;background:#eef7ff;border-radius:14px;padding:18px;font-size:1.25rem;font-weight:900}.status,.small{font-size:.82rem;color:var(--muted)}
.correct{border-color:var(--good)!important;background:#eef9f2!important}.wrong{border-color:var(--bad)!important;background:#fff1f1!important}



@media(max-width:650px){.grid2,.answer-row,.wrap{padding:7px}.diagram img{max-width:88%;max-height:165px}}
</style>
</head>

let startTime=Date.now(); const $=id=>document.getElementById(id);
function init(){
  Object.keys(STUDENTS).forEach(c=>{
    let o=document.createElement('option');
    o.value=c;o.textContent=c;
    $('kelas').appendChild(o)
  });

  $('kelas').addEventListener('change',()=>{
    let c=$('kelas').value,n=$('nama');
    n.innerHTML='<option value="">-- Pilih nama --</option>';
    if(c) STUDENTS[c].forEach(x=>{
      let o=document.createElement('option');
      o.value=x;o.textContent=x;
      n.appendChild(o)
    });
    n.disabled=!c
  });

  renderQuiz();
  loadRanking();
}
function renderQuiz(){$('quiz').innerHTML=QUESTIONS.map(q=>`<section class="card"><div class="qhead">${q.n}. ${q.prompt}</div><div class="diagram"><img src="${q.img}" alt="Rajah asal soalan ${q.n}"></div><div class="answer-row"><details class="guide"><summary>📘 Panduan</summary><div class="small">${hintFor(q.n)}</div></details><div class="degree-input"><input id="ans${q.n}" type="number" step="0.5" inputmode="decimal" placeholder="Jawapan"><span class="degree">°</span></div></div></section>`).join('')}
function hintFor(n){if([1,2,3,4,5,6,13].includes(n))return 'Sudut pada garis lurus berjumlah 180°. Sudut tegak ialah 90°.';return 'Jumlah sudut di sekeliling satu titik ialah 360°.'}

function toggleManualEntry(){
  const on=$('manualToggle').checked;
  $('manualBox').style.display=on?'block':'none';
  $('kelas').disabled=on;
  $('nama').disabled=on || !$('kelas').value;

  if(on){
    $('kelas').value='';
    $('nama').innerHTML='<option value="">-- Pilih nama --</option>';
    $('nama').value='';
  }else{
    $('manualClass').value='';
    $('manualName').value='';
  }
}

function getStudentIdentity(){
  if($('manualToggle').checked){
    return {
      kelas:String($('manualClass').value||'').trim().toUpperCase(),
      nama:String($('manualName').value||'').trim().toUpperCase()
    };
  }

  return {
    kelas:$('kelas').value,
    nama:$('nama').value
  };
}

function submitQuiz(){const ident=getStudentIdentity();if(!ident.kelas||!ident.nama){alert('Sila pilih atau masukkan kelas dan nama pelajar dahulu.');return}let miss=[],score=0;QUESTIONS.forEach(q=>{let v=$('ans'+q.n).value;if(v==='')miss.push(q.n);else if(Math.abs(Number(v)-q.answer)<0.001)score++});if(miss.length){alert('Belum dijawab: '+miss.join(', '));return}const seconds=Math.max(1,Math.round((Date.now()-startTime)/1000));QUESTIONS.forEach(q=>{let el=$('ans'+q.n),ok=Math.abs(Number(el.value)-q.answer)<0.001;el.classList.toggle('correct',ok);el.classList.toggle('wrong',!ok)});$('resultBox').style.display='block';$('resultBox').innerHTML=`<div class="result">Markah: ${score} / 15 (${Math.round(score/15*100)}%)<br><span class="small">Masa: ${Math.floor(seconds/60)} minit ${seconds%60} saat</span></div>`;$('retryBtn').style.display='block';const st=$('saveStatus');st.style.display='block';st.textContent='Sedang menghantar markah ke Google Sheet...';const f=document.createElement('form');f.method='POST';f.action=SCRIPT_URL;f.target='gsheet_sink';f.style.display='none';const payload={action:'submit',set:SET_NAME,kelas:ident.kelas,nama:ident.nama,markah:String(score),jumlah:'15',masaSaat:String(seconds)};Object.entries(payload).forEach(([k,v])=>{let inp=document.createElement('input');inp.type='hidden';inp.name=k;inp.value=v;f.appendChild(inp)});document.body.appendChild(f);f.submit();setTimeout(()=>{st.style.color='#18794e';st.textContent='✓ Markah telah dihantar ke Google Sheet.';f.remove()},1200)}
function retryQuiz(){QUESTIONS.forEach(q=>{let el=$('ans'+q.n);el.value='';el.classList.remove('correct','wrong')});$('resultBox').style.display='none';$('saveStatus').style.display='none';$('retryBtn').style.display='none';startTime=Date.now();window.scrollTo({top:0,behavior:'smooth'})}
function showRankView(v){$('overallView').style.display=v==='overall'?'block':'none';$('classView').style.display=v==='class'?'block':'none';$('tabOverall').classList.toggle('active',v==='overall');$('tabClass').classList.toggle('active',v==='class');if(v==='class')renderClassRank()}
function rankRows(items){if(!items||!items.length)return '<div class="small">Belum ada rekod.</div>';return items.map(r=>`<div class="rank-grid"><div class="rank-num">${r.rank}</div><div><div class="rank-name">${r.nama}</div><div class="rank-class">${r.kelas}</div></div><div><b>${r.markah}/${r.jumlah}</b></div><div>${Math.floor((r.masaSaat||0)/60)}m ${(r.masaSaat||0)%60}s</div></div>`).join('')}
function renderClassRank(){let c=$('classFilter').value;$('classRank').innerHTML=rankRows(BY_CLASS_DATA[c]||[])}
function jsonpRequest(action){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*100000),s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('Tiada respons daripada Apps Script.'))},12000);function cleanup(){clearTimeout(timer);if(s.parentNode)s.parentNode.removeChild(s);try{delete window[cb]}catch(e){}}window[cb]=data=>{cleanup();resolve(data)};s.onerror=()=>{cleanup();reject(new Error('Gagal berhubung dengan Apps Script.'))};s.src=SCRIPT_URL+'?action='+encodeURIComponent(action)+'&set='+encodeURIComponent(SET_NAME)+'&callback='+encodeURIComponent(cb);document.body.appendChild(s)})}
async function loadRanking(){try{$('rankError').style.display='none';const[a,b]=await Promise.all([jsonpRequest('ranking50'),jsonpRequest('rankingByClass')]);if(!a.ok)throw new Error(a.message||'Ranking tingkatan gagal');if(!b.ok)throw new Error(b.message||'Ranking kelas gagal');OVERALL_DATA=a.top20||[];BY_CLASS_DATA=b.byClass||{};$('overallRank').innerHTML=rankRows(OVERALL_DATA);renderClassRank()}catch(e){$('rankError').style.display='block';$('rankError').textContent='Ranking tidak dapat dimuatkan: '+e.message}}
init();
</script></body></html>
