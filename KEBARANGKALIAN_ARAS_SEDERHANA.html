const DURATION = 30 * 60;
let currentName = "", currentClass = "", startAt = 0, deadline = 0, timerHandle = null, submitted = false;
function esc(s){return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");}
function init(){const cls=[...new Set(students.map(s=>s.class))].sort();document.getElementById('kelas').innerHTML='<option value="">-- Pilih kelas --</option>'+cls.map(c=>`<option>${esc(c)}</option>`).join('');}
function loadNames(){const cls=document.getElementById('kelas').value;const list=students.filter(s=>s.class===cls).sort((a,b)=>a.name.localeCompare(b.name));document.getElementById('nama').innerHTML='<option value="">-- Pilih nama --</option>'+list.map(s=>`<option>${esc(s.name)}</option>`).join('');}

function hintFor(q){
  const t = String(q.q||"").toLowerCase();

  if(t.includes("bakul a") && t.includes("bakul b")){
    return `<b>Contoh jalan kerja</b>
    <span class="mini math">
      <span class="workline"><span class="worknum">1.</span><span>P(Merah dari A) = 3/5</span></span>
      <span class="workline"><span class="worknum">2.</span><span>P(Hijau dari B) = 4/6</span></span>
      <span class="workline"><span class="worknum">3.</span><span>Oleh sebab pilih satu daripada setiap bakul:</span></span>
      <span class="eq">P(Merah A ∩ Hijau B)</span>
      <span class="eq">= 3/5 × 4/6</span>
      <span class="eq">= 12/30</span>
      <span class="answerline">Kemudian ringkaskan pecahan.</span>
    </span>`;
  }

  if(t.includes("huruf vokal")){
    return `<b>Contoh jalan kerja</b>
    <span class="mini math">
      <span class="workline"><span class="worknum">1.</span><span>Senaraikan vokal: A, E, I, O, U.</span></span>
      <span class="workline"><span class="worknum">2.</span><span>Kira huruf vokal yang ada dalam kotak.</span></span>
      <span class="eq">P(vokal) = bilangan vokal / jumlah kad</span>
      <span class="answerline">Masukkan nilai daripada rajah.</span>
    </span>`;
  }

  if(t.includes("dikembalikan")){
    return `<b>Contoh jalan kerja</b>
    <span class="mini math">
      <span class="workline"><span class="worknum">1.</span><span>Pilihan pertama: P(Merah) = 3/5</span></span>
      <span class="workline"><span class="worknum">2.</span><span>Guli dikembalikan, jadi pilihan kedua masih:</span></span>
      <span class="eq">P(Merah) = 3/5</span>
      <span class="eq">P(Merah, Merah) = 3/5 × 3/5</span>
      <span class="answerline">Darab sepanjang satu laluan.</span>
    </span>`;
  }

  if(t.includes("tanpa pengembalian")){
    return `<b>Contoh jalan kerja</b>
    <span class="mini math">
      <span class="workline"><span class="worknum">1.</span><span>Rawak pertama guna kebarangkalian asal.</span></span>
      <span class="eq">Contoh: P(Merah) = 5/8</span>
      <span class="workline"><span class="worknum">2.</span><span>Selepas satu merah diambil tanpa pengembalian:</span></span>
      <span class="eq">P(Merah kedua) = 4/7</span>
      <span class="workline"><span class="worknum">3.</span><span>Darabkan:</span></span>
      <span class="eq">P(Merah, Merah) = 5/8 × 4/7</span>
      <span class="answerline">Akhir sekali ringkaskan.</span>
    </span>`;
  }

  if(t.includes("dua biji dadu")){
    return `<b>Contoh jalan kerja</b>
    <span class="mini math">
      <span class="workline"><span class="worknum">1.</span><span>Dua dadu mempunyai 6 × 6 = 36 kesudahan.</span></span>
      <span class="workline"><span class="worknum">2.</span><span>Senaraikan pasangan yang memenuhi syarat.</span></span>
      <span class="eq">P(peristiwa) = bilangan pasangan dikehendaki / 36</span>
      <span class="answerline">Kira pasangan sebelum memilih jawapan.</span>
    </span>`;
  }

  if(t.includes("syiling")){
    return `<b>Contoh jalan kerja</b>
    <span class="mini math">
      <span class="eq">Ruang sampel dua lambungan:</span>
      <span class="eq">{MM, MN, NM, NN}</span>
      <span class="eq">Bilangan kesudahan = 4</span>
      <span class="answerline">Gunakan ruang sampel untuk menjawab.</span>
    </span>`;
  }

  if(t.includes("p(a)")){
    return `<b>Contoh jalan kerja</b>
    <span class="mini math">
      <span class="eq">P(A) + P(A') = 1</span>
      <span class="eq">P(A') = 1 − P(A)</span>
      <span class="eq">= 1 − 0.35</span>
      <span class="answerline">Kira nilai akhir.</span>
    </span>`;
  }

  return `<b>Contoh jalan kerja</b>
  <span class="mini math">
    <span class="workline"><span class="worknum">1.</span><span>Pilih satu laluan dalam rajah pokok.</span></span>
    <span class="workline"><span class="worknum">2.</span><span>Darab semua kebarangkalian pada laluan itu.</span></span>
    <span class="eq">P(laluan) = P(cabang 1) × P(cabang 2)</span>
    <span class="workline"><span class="worknum">3.</span><span>Jika ada lebih daripada satu laluan yang memenuhi syarat, jumlahkan.</span></span>
    <span class="answerline">Darab sepanjang laluan, tambah antara laluan.</span>
  </span>`;
}

function renderQuestion(q,i){const d=q.svg?`<div class="visual-row"><div class="diagram">${q.svg}</div><div class="hintbox">${hintFor(q)}</div></div>`:`<div class="hintbox">${hintFor(q)}</div>`; return `<div class="qcard" id="card${i}"><div class="qhead"><div class="qno">SOALAN ${i+1}</div><div class="cat">${esc(q.cat)}</div></div><div class="qtext">${esc(q.q)}</div>${d}<div class="choices">${q.o.map((c,j)=>`<label class="choice" id="ch${i}_${j}"><input type="radio" name="q${i}" value="${j}" onchange="progress()"><div><b>${String.fromCharCode(65+j)}.</b> ${esc(c)}</div></label>`).join('')}</div><div class="feedback" id="fb${i}"></div><div class="solution" id="sol${i}"><b>Jalan kerja:</b> ${esc(q.w)}</div></div>`;}
function startQuiz(){currentClass=document.getElementById('kelas').value; currentName=document.getElementById('nama').value; if(!currentClass||!currentName) return alert('Pilih kelas dan nama dahulu.'); submitted=false; startAt=Date.now(); deadline=startAt+DURATION*1000; document.getElementById('login').classList.add('hidden'); document.getElementById('quiz').classList.remove('hidden'); document.getElementById('studentBadge').textContent=currentName; document.getElementById('classBadge').textContent=currentClass; document.getElementById('questions').innerHTML=questions.map(renderQuestion).join(''); progress(); startTimer();}
function progress(){let n=0; questions.forEach((_,i)=>{ if(document.querySelector(`input[name=q${i}]:checked`)) n++; }); document.getElementById('answeredBadge').textContent=n+'/20 dijawab'; document.getElementById('bar').style.width=(n/20*100)+'%';}
function startTimer(){clearInterval(timerHandle); timerHandle=setInterval(()=>{ if(submitted) return; const s=Math.max(0,Math.ceil((deadline-Date.now())/1000)); const el=document.getElementById('timer'); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); el.className='timer'+(s<=60?' danger':s<=300?' warn':''); if(s<=0){ clearInterval(timerHandle); el.textContent='MASA TAMAT'; submitQuiz(true); } },250);}
async function submitQuiz(auto){ if(submitted) return; submitted=true; clearInterval(timerHandle); let score=0, blank=0; questions.forEach((q,i)=>{ const picked=document.querySelector(`input[name=q${i}]:checked`); document.querySelectorAll(`input[name=q${i}]`).forEach(el=>el.disabled=true); document.getElementById('sol'+i).style.display='block'; if(!picked){ blank++; document.getElementById('fb'+i).textContent='Belum dijawab • 0 markah'; return; } const v=Number(picked.value); if(v===q.a){ score++; document.getElementById('ch'+i+'_'+v).classList.add('correct'); document.getElementById('fb'+i).textContent='Betul ✓'; } else { document.getElementById('ch'+i+'_'+v).classList.add('wrong'); document.getElementById('ch'+i+'_'+q.a).classList.add('correct'); document.getElementById('fb'+i).textContent='Salah ✗ • Jawapan betul: '+String.fromCharCode(65+q.a); } }); const pct=Math.round(score/questions.length*100); const duration=Math.min(DURATION,Math.round((Date.now()-startAt)/1000)); const rec={ name:currentName, class:currentClass, set:'KEBARANGKALIAN ARAS SEDERHANA', score:score, total:questions.length, pct:pct, duration_seconds:duration, timed_out:auto, unanswered:blank }; try{ await fetch(WEB_APP_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(rec) }); }catch(e){} document.getElementById('submitBtn').disabled=true; const result=document.getElementById('result'); result.classList.remove('hidden'); result.innerHTML=`<div class="result"><b>${auto?'Masa tamat — jawapan dihantar secara automatik.':'Semakan selesai.'}</b><div class="big">${score} / ${questions.length}</div><div>${pct}%</div><p>${blank} soalan tidak dijawab.</p><p class="note">Jalan kerja dipaparkan di bawah setiap soalan.</p></div>`; result.scrollIntoView({behavior:'smooth'}); }
init();
</script>
