<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKOR Matematik 15 to 40 • SET 3</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--muted:#667085;--line:#d9e2f1;--primary:#155eef;--good:#0f9d58;--bad:#d92d20;--warn:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#102a56,#155eef);color:#fff;padding:24px 16px}.wrap{max-width:900px;margin:auto}h1{margin:0 0 6px;font-size:clamp(24px,5vw,38px)}header p{margin:3px 0}.panel,.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(16,42,86,.07)}.panel{padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}label{font-weight:700;font-size:14px}select,button{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #b8c4d6;font-size:15px}button{cursor:pointer;border:0;font-weight:800}.primary{background:var(--primary);color:#fff}.hidden{display:none!important}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge,.timer{padding:8px 10px;border-radius:999px;font-weight:800}.badge{background:#eef4ff}.timer{background:#111827;color:#fff;margin-left:auto}.timer.warn{background:var(--warn)}.timer.danger{background:var(--bad)}.progress{height:11px;background:#e8edf5;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--primary);width:0}.qcard{padding:16px;margin:13px 0}.qnum{font-size:13px;font-weight:900;color:var(--primary)}.qtext{font-size:17px;line-height:1.5;margin:7px 0 10px}.opt{display:block;border:1px solid var(--line);padding:10px;border-radius:10px;margin:7px 0;cursor:pointer}.opt input{width:auto;margin-right:8px}.correct{border-color:#84d6aa;background:#ecfdf3}.wrong{border-color:#f4a5a0;background:#fff1f0}.feedback{margin-top:8px;font-weight:800;font-size:13px}.solution{display:none;margin-top:10px;background:#f8fafc;border-left:4px solid #64748b;padding:10px;border-radius:8px;font-size:13px;line-height:1.5}.result{text-align:center;padding:18px;background:#eef4ff;border-radius:14px}.big{font-size:44px;font-weight:900;color:var(--primary)}.note{font-size:13px;color:var(--muted);line-height:1.5}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:0 6px}header{padding:18px 12px}.panel{padding:12px}.qcard{padding:12px}.qtext{font-size:15px}.opt{font-size:14px;padding:9px}.timer{margin-left:0}}

<body>
<header><div class="wrap"><h1>SKOR Matematik 15 to 40</h1><p><b>Kertas 1 • Aras Rendah • SET 3</b></p><p>20 soalan objektif • 30 minit</p></div></header>
<main class="wrap">
<section class="panel" id="login">
<h2>Maklumat Murid</h2>
<div class="grid"><div><label>Kelas</label><select id="kelas" onchange="loadNames()"><option value="">-- Pilih kelas --</option></select></div><div><label>Nama murid</label><select id="nama"><option value="">-- Pilih kelas dahulu --</option></select></div></div>
<p class="note">Masa bermula apabila butang MULA ditekan. Jika masa tamat, jawapan akan disemak dan dihantar secara automatik.</p>
<button class="primary" onclick="startQuiz()">MULA SET 3</button>
</section>

<section id="quiz" class="hidden">
<div class="panel"><div class="meta"><span class="badge" id="studentBadge"></span><span class="badge" id="classBadge"></span><span class="badge">SET 3</span><span class="badge" id="answeredBadge">0/20 dijawab</span><span class="timer" id="timer">30:00</span></div><div class="progress"><div id="bar"></div></div></div>
<div id="questions"></div>
<div class="panel"><button class="primary" id="submitBtn" onclick="submitQuiz(false)">HANTAR JAWAPAN</button></div>
</section>
<section id="result" class="hidden panel"></section>
</main>

<script>
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbyBZCWaoWnFYqWNUnQz96VKsrjVcRYXW43_RmhSpksioii1MwiaM2CiRn8iXlx_kzOA/exec";
const students=[{"name": "SAM ZHI KHOI", "class": "EMERALD"}, {"name": "CHONG JIN TONG", "class": "DIAMOND"}, {"name": "VANNESA CHONG TING EN", "class": "EMERALD"}, {"name": "LIEW WEI XUN", "class": "SAPPHIRE"}, {"name": "SIM ZI HANG", "class": "SAPPHIRE"}, {"name": "MUHAMMAD ZEYN NIFAIL BIN ZAINAL", "class": "DIAMOND"}, {"name": "ZULAIKA BINTI SULAIMAN", "class": "DIAMOND"}, {"name": "KAMALIA DARWISYAH BINTI AZHAN", "class": "EMERALD"}, {"name": "MUHAMMAD SYAHMI ADHA BIN ZAMRI", "class": "DIAMOND"}, {"name": "MUHAMMAD ZAID BIN MUSTAPA", "class": "DIAMOND"}, {"name": "SAFIYA AUNI BINTI SAIFUL LIZAN", "class": "DIAMOND"}, {"name": "SELINA TAN QI ROU", "class": "DIAMOND"}, {"name": "WONG KA XUAN", "class": "EMERALD"}, {"name": "AQILAH SAIYEEDAH BINTI MD FABILAH", "class": "EMERALD"}, {"name": "NUR SYAMILA BINTI MOHD FARID", "class": "DIAMOND"}, {"name": "HEU CHIA NEE", "class": "EMERALD"}, {"name": "NUR ARISSYA AMEYLDA BINTI AZIZ", "class": "EMERALD"}, {"name": "CHAN WAI THONG", "class": "DIAMOND"}, {"name": "MUHAMMAD AL HAFIZ BIN MOHD SAIFULLIZAM", "class": "DIAMOND"}, {"name": "NUR AIN NADIRA BINTI SHAHRUDIN", "class": "EMERALD"}, {"name": "NUR'ALYA QISTINA BINTI MOHD HASRIME", "class": "DIAMOND"}, {"name": "PUTERI NUR ALEESYA BINTI MOHD AZHAN KWONG", "class": "DIAMOND"}, {"name": "HON THONG THONG", "class": "EMERALD"}, {"name": "AMIR WAFIEY BIN ZAINAL ABIDIN", "class": "DIAMOND"}, {"name": "MUHAMMAD DARWISY AHNA BIN MAZLAN", "class": "DIAMOND"}, {"name": "NOR AMIRA BINTI MOHAMMAD NAZIR", "class": "RUBY"}, {"name": "HUSNATUN SYIFA' BINTI MOHD HAFEZ", "class": "EMERALD"}, {"name": "SITI NURQURRATUAINIE BINTI MOHAMMAD HIRMAN", "class": "EMERALD"}, {"name": "MUHAMMAD DANIAL BIN MOHD MOKHTAR", "class": "DIAMOND"}, {"name": "MUHAMMAD RIZQ IQBAAL BIN FAIZAL", "class": "DIAMOND"}, {"name": "JUSTIN NELSON", "class": "EMERALD"}, {"name": "NUR QISTINA BALQIS BINTI AZHAR", "class": "DIAMOND"}, {"name": "RIDHUAN BIN ROSLEE", "class": "DIAMOND"}, {"name": "LIM YI XIAN", "class": "SAPPHIRE"}, {"name": "LIEW SIN JAJ", "class": "EMERALD"}, {"name": "NOR ATHIRAH BINTI MOHD IZAN", "class": "EMERALD"}, {"name": "NURUL SYAQIRAH BINTI MAZLAN", "class": "EMERALD"}, {"name": "IRIS NUR AISYAH BINTI MOHD HEFFE", "class": "EMERALD"}, {"name": "IZZI HALEEF BIN AZALI", "class": "DIAMOND"}, {"name": "AIERIL ZAQUAN BIN KUSNOS", "class": "EMERALD"}, {"name": "MUHAMMAD ADAM DANIAL BIN ABD AZIZ", "class": "EMERALD"}, {"name": "NUR DAWIRNA SAFFI BINTI ISHAK", "class": "EMERALD"}, {"name": "NUR ELISYA BINTI KHAIRUL AKMAL", "class": "EMERALD"}, {"name": "MUHAMMAD HARIS BIN JAMALUDIN", "class": "EMERALD"}, {"name": "ARMAN ARIF BIN MUHAMAD RAKBI", "class": "EMERALD"}, {"name": "MUBIN HARITH BIN MOHAMMAD MUBIN", "class": "EMERALD"}, {"name": "NG MEI XIN", "class": "SAPPHIRE"}, {"name": "AIN NATASHA BINTI MOHD ZAINAL ABIDIN", "class": "RUBY"}, {"name": "HUMAIRAH DANISHA BINTI ABDUL RAZAK", "class": "RUBY"}, {"name": "MUHAMMAD FITRI SYAH BIN MOHD NAJIB", "class": "RUBY"}, {"name": "NUR LIYANA BINTI KADERI", "class": "RUBY"}, {"name": "SITI NUR HAWA BINTI MD AZMI", "class": "RUBY"}, {"name": "AMIRA BINTI EIRHAN", "class": "EMERALD"}, {"name": "CHONG YU ZHE", "class": "SAPPHIRE"}, {"name": "HAN JO EN", "class": "RUBY"}, {"name": "SAIDATUL AKEMA BINTI MU'MININ", "class": "RUBY"}, {"name": "MUHAMMAD ZAINUL ZAKWAN BIN RAZALEE", "class": "EMERALD"}, {"name": "NURFARAH HANUM BINTI SALIM", "class": "EMERALD"}, {"name": "KHAIRUNISA BINTI ABDULLAH", "class": "EMERALD"}, {"name": "MUHAMMAD IZUDDIN BIN JANESDIN", "class": "RUBY"}, {"name": "CHONG JIA EN", "class": "SAPPHIRE"}, {"name": "CHEON ZI SHAN", "class": "RUBY"}, {"name": "MUHAMAD ALIF PUTRA BIN ZULKIFFLE", "class": "RUBY"}, {"name": "MUHAMMAD DINIE FIRDAUS BIN NORARMIZAN", "class": "RUBY"}, {"name": "SITI SOLEHA BINTI MARJUNI", "class": "RUBY"}, {"name": "MUHAMMAD ALIIF ZHORIIF BIN MOHD ABDULLAH", "class": "EMERALD"}, {"name": "MUHAMMAD ARIF HAKIMI BIN ABDULLAH", "class": "EMERALD"}, {"name": "MOHAMAD FAZRUL HAZIQ BIN MOHD AMIN", "class": "SAPPHIRE"}, {"name": "NUR HAZIRA SYAFIERA BINTI AL-HAFIZ", "class": "SAPPHIRE"}, {"name": "ADAM PUTERA BIN MOHAMAD SOLLEHAN", "class": "EMERALD"}, {"name": "MUHAMMAD THAQIF BIN AZMAN", "class": "EMERALD"}, {"name": "CHAI YU ZHE", "class": "ZIRCON"}, {"name": "CHANG JIA HENG", "class": "ZIRCON"}, {"name": "MUHAMMAD FAIQ BIN MOHD FARID", "class": "RUBY"}, {"name": "AL MAN SYAH RIZZAL BIN ABD SUKOR", "class": "SAPPHIRE"}, {"name": "AZLY FAHMI BIN AZRI SHAM", "class": "SAPPHIRE"}, {"name": "HAIQAL IKHWAN BIN NORHALIFI", "class": "SAPPHIRE"}, {"name": "NURUL AZREENA FATIHAH BINTI NORSHAM", "class": "SAPPHIRE"}, {"name": "PUTERI SHAHILA BINTI MOHD HALIM SHAH", "class": "SAPPHIRE"}, {"name": "NURDAYANA ELLYSYA BINTI ABDULLAH", "class": "RUBY"}, {"name": "AHMAD THAQIF IMRAN BIN NORAZMAN", "class": "SAPPHIRE"}, {"name": "CHAU RUI MENG", "class": "SAPPHIRE"}, {"name": "MUHAMMAD WAFIQ BIN MOHD FARID", "class": "RUBY"}, {"name": "CHOON LI XIN", "class": "SAPPHIRE"}, {"name": "LIM JOO YU", "class": "SAPPHIRE"}, {"name": "NAJIB IRFAN BIN NORDIN", "class": "SAPPHIRE"}, {"name": "WONG JIA HUI", "class": "SAPPHIRE"}, {"name": "NUR ALEEYA BINTI RAMLAN", "class": "RUBY"}, {"name": "NURSAFIYYAH BALQIS BINTI ZULKIFLY", "class": "RUBY"}, {"name": "NURUL IMAN ANISSA BINTI SHAHRIZAN", "class": "RUBY"}, {"name": "SOFIANA DEWI BINTI ABDULLAH", "class": "RUBY"}, {"name": "IRFAN ISKANDAR BIN MAT SAAT", "class": "EMERALD"}, {"name": "MUHAMMAD ADAM DANIAL BIN AZWHA", "class": "EMERALD"}, {"name": "ANIS ADHANUN SYIFAA BINTI SAMSUL BAHARI", "class": "SAPPHIRE"}, {"name": "MUHAMAD ZULHAIRIE BIN KHAIRULIZAM", "class": "SAPPHIRE"}, {"name": "MUHAMMAD ADAM DARWISY BIN MAZLIHAN", "class": "SAPPHIRE"}, {"name": "MUHAMMAD HILMI BIN HAMZAH", "class": "SAPPHIRE"}, {"name": "DERREN LAI PIN CHAO", "class": "ZIRCON"}, {"name": "SACHIN A/L RAMAMURTHY", "class": "ZIRCON"}, {"name": "TAN JIAN YI", "class": "ZIRCON"}, {"name": "MUHAMAD FARISH HAIKAL BIN OSMAN", "class": "SAPPHIRE"}, {"name": "MUHAMMAD HELMI BIN MAHADI", "class": "SAPPHIRE"}, {"name": "YONG LI LING", "class": "SAPPHIRE"}, {"name": "KHAIRUNNISA BINTI KOMARUDDIN", "class": "RUBY"}, {"name": "MOHAMAD FARIZUAN SHAHRUL BIN HAMDAN", "class": "RUBY"}, {"name": "NUR RABIAATUL ATIKA SYAHIRA BINTI MAZLAN", "class": "RUBY"}, {"name": "SITI NUR ALEYA BINTI MOHD NIZAM", "class": "RUBY"}, {"name": "MUHAMMAD RAHFIQ BIN RAHMAT", "class": "ZIRCON"}, {"name": "YAP ZHI LI", "class": "ZIRCON"}, {"name": "MUHAMMAD RIZMAN QUZAIMI BIN RAMLI", "class": "SAPPHIRE"}, {"name": "RIEFQIEE ADAMI BIN RIZAL", "class": "RUBY"}, {"name": "WONG YU GUAN", "class": "ZIRCON"}, {"name": "PUTRA ARMAND DARIUS BIN RAHMAT", "class": "SAPPHIRE"}, {"name": "CHEON ZI XUAN", "class": "ZIRCON"}, {"name": "CHANG JIA QI", "class": "SAPPHIRE"}, {"name": "MUHAMMAD DANISH RIFQI BIN MOHD NAZLI", "class": "SAPPHIRE"}, {"name": "MUHAMMAD HAZEEQ INDRA BIN AZALI", "class": "ZIRCON"}, {"name": "FATIN NASUHA BINTI ZAHARI", "class": "RUBY"}, {"name": "MUHAMMAD ALIF DANIEL BIN MUJAHID", "class": "ZIRCON"}, {"name": "CHONG CHEE CHEN", "class": "SAPPHIRE"}, {"name": "CHIN JI HAO", "class": "ZIRCON"}, {"name": "CHONG JING SHENG", "class": "ZIRCON"}, {"name": "CHONG LIH MIN", "class": "ZIRCON"}, {"name": "CHONG LIH SEEN", "class": "ZIRCON"}];
const questions=[{"q": "Bundarkan 4.764 betul kepada dua angka bererti.", "o": ["4.7", "4.8", "4.76", "4.77"], "a": 1, "w": "Dua angka bererti bagi 4.764 ialah 4 dan 7. Digit seterusnya ialah 6, jadi 4.7 dibundarkan naik menjadi 4.8."}, {"q": "Tulis 0.000582 dalam bentuk piawai.", "o": ["5.82 × 10⁻⁴", "5.82 × 10⁻³", "58.2 × 10⁻⁵", "0.582 × 10⁻³"], "a": 0, "w": "Gerakkan titik perpuluhan 4 tempat ke kanan: 0.000582 = 5.82 × 10⁻⁴."}, {"q": "Hitung 6.15 − 4.68.", "o": ["1.37", "1.47", "1.57", "2.47"], "a": 1, "w": "6.15 − 4.68 = 1.47."}, {"q": "Harga sebuah beg ialah RM80. Kedai memberi diskaun 15%. Berapakah harga selepas diskaun?", "o": ["RM12", "RM65", "RM68", "RM72"], "a": 2, "w": "Diskaun = 15% × 80 = RM12. Harga selepas diskaun = 80 − 12 = RM68."}, {"q": "Urutan nombor ialah 5, 9, 13, 17, … Apakah sebutan seterusnya?", "o": ["19", "20", "21", "22"], "a": 2, "w": "Beza sepunya ialah +4. Jadi 17 + 4 = 21."}, {"q": "Permudahkan 3x + 5x − 2.", "o": ["8x − 2", "8x + 2", "15x − 2", "2x + 8"], "a": 0, "w": "3x + 5x = 8x. Maka ungkapan menjadi 8x − 2."}, {"q": "Selesaikan 2x + 5 = 17.", "o": ["5", "6", "7", "11"], "a": 1, "w": "2x = 12, maka x = 6."}, {"q": "Selesaikan ketaksamaan x − 3 < 5.", "o": ["x < 2", "x < 8", "x > 2", "x > 8"], "a": 1, "w": "Tambah 3 pada kedua-dua belah: x < 8."}, {"q": "Diberi A = [2  1; 3  4] dan B = [1  2; 0  5]. Cari A + B.", "o": ["[3  3; 3  9]", "[2  2; 3  20]", "[1  −1; 3  −1]", "[3  2; 4  9]"], "a": 0, "w": "Tambah unsur yang sepadan: [2+1, 1+2; 3+0, 4+5] = [3 3; 3 9]."}, {"q": "y berubah secara langsung dengan x². Diberi y = 20 apabila x = 2. Cari y apabila x = 3.", "o": ["30", "40", "45", "60"], "a": 2, "w": "y = kx². 20 = k(4), jadi k = 5. Apabila x = 3, y = 5(9) = 45."}, {"q": "Sebuah segi tiga bersudut tegak mempunyai sisi tegak 6 cm dan 8 cm. Cari panjang hipotenus.", "o": ["10 cm", "12 cm", "14 cm", "48 cm"], "a": 0, "w": "Hipotenus² = 6² + 8² = 36 + 64 = 100. Hipotenus = 10 cm."}, {"q": "Cari min bagi data 4, 6, 7, 8, 10.", "o": ["6", "7", "7.5", "8"], "a": 1, "w": "Jumlah = 35. Min = 35 ÷ 5 = 7."}, {"q": "Sebuah beg mengandungi 3 guli merah dan 2 guli biru. Kebarangkalian memilih satu guli merah ialah", "o": ["2/5", "3/5", "1/2", "3/2"], "a": 1, "w": "Jumlah guli = 5. Kebarangkalian merah = 3/5."}, {"q": "Diberi A = {1,2,3,4} dan B = {3,4,5}. Cari A ∩ B.", "o": ["{1,2}", "{3,4}", "{1,2,5}", "{1,2,3,4,5}"], "a": 1, "w": "Persilangan ialah unsur yang terdapat dalam kedua-dua set, iaitu {3,4}."}, {"q": "Cari kecerunan garis yang melalui titik (2,3) dan (6,11).", "o": ["1", "2", "3", "4"], "a": 1, "w": "Kecerunan = (11−3)/(6−2) = 8/4 = 2."}, {"q": "Sebuah kereta bergerak sejauh 120 km dalam 2 jam. Cari laju purata.", "o": ["40 km/j", "50 km/j", "60 km/j", "240 km/j"], "a": 2, "w": "Laju = jarak ÷ masa = 120 ÷ 2 = 60 km/j."}, {"q": "Faedah mudah bagi RM1000 pada kadar 4% setahun selama 2 tahun ialah", "o": ["RM40", "RM80", "RM400", "RM1080"], "a": 1, "w": "Faedah mudah = PRT = 1000 × 0.04 × 2 = RM80."}, {"q": "Kos rawatan ialah RM2500 dan deduktibel insurans ialah RM500. Berapakah baki kos selepas deduktibel?", "o": ["RM500", "RM1500", "RM2000", "RM3000"], "a": 2, "w": "Baki kos = RM2500 − RM500 = RM2000."}, {"q": "Diberi y = 3x + 2. Cari nilai y apabila x = 4.", "o": ["10", "12", "14", "18"], "a": 2, "w": "y = 3(4) + 2 = 14."}, {"q": "Set semesta ξ = {1,2,3,4,5,6} dan A = {2,4,6}. Cari A′.", "o": ["{1,3,5}", "{2,4,6}", "{1,2,3}", "{4,5,6}"], "a": 0, "w": "A′ mengandungi unsur dalam set semesta yang bukan dalam A, iaitu {1,3,5}."}];
const DURATION=30*60;
let currentName="",currentClass="",deadline=0,startAt=0,timerHandle=null,submitted=false;

function init(){
 const k=[...new Set(students.map(s=>s.class))].sort();
 kelas.innerHTML='<option value="">-- Pilih kelas --</option>'+k.map(x=>`<option>${x}</option>`).join("");
}
function loadNames(){
 currentClass=kelas.value;
 const arr=students.filter(s=>s.class===currentClass).sort((a,b)=>a.name.localeCompare(b.name));
 nama.innerHTML='<option value="">-- Pilih nama --</option>'+arr.map(s=>`<option>${s.name}</option>`).join("");
}
function startQuiz(){
 currentClass=kelas.value;currentName=nama.value;
 if(!currentClass||!currentName)return alert("Pilih kelas dan nama dahulu.");
 submitted=false;startAt=Date.now();deadline=startAt+DURATION*1000;
 login.classList.add("hidden");quiz.classList.remove("hidden");
 studentBadge.textContent=currentName;classBadge.textContent=currentClass;
 questionsEl=document.getElementById("questions");
 questionsEl.innerHTML=questions.map((q,i)=>`<div class="qcard" id="card${i}"><div class="qnum">SOALAN ${i+1}</div><div class="qtext">${q.q}</div>${q.o.map((o,j)=>`<label class="opt" id="opt${i}_${j}"><input type="radio" name="q${i}" value="${j}" onchange="progress()"><b>${String.fromCharCode(65+j)}.</b> ${o}</label>`).join("")}<div class="feedback" id="fb${i}"></div><div class="solution" id="sol${i}"><b>Jalan kerja:</b> ${q.w}</div></div>`).join("");
 progress();tick();
}
function progress(){
 let n=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++});
 answeredBadge.textContent=n+"/20 dijawab";bar.style.width=(n/20*100)+"%";
}
function tick(){
 clearInterval(timerHandle);
 timerHandle=setInterval(()=>{
  if(submitted)return;
  let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  timer.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  timer.className="timer"+(s<=60?" danger":s<=300?" warn":"");
  if(s<=0){clearInterval(timerHandle);timer.textContent="MASA TAMAT";submitQuiz(true)}
 },250);
}
async function submitQuiz(auto){
 if(submitted)return;submitted=true;clearInterval(timerHandle);
 let score=0,blank=0;
 questions.forEach((q,i)=>{
  const p=document.querySelector(`input[name=q${i}]:checked`);
  document.querySelectorAll(`input[name=q${i}]`).forEach(x=>x.disabled=true);
  document.getElementById("sol"+i).style.display="block";
  if(!p){blank++;fb=document.getElementById("fb"+i);fb.textContent="Belum dijawab • 0 markah";document.getElementById("card"+i).classList.add("wrong");return}
  const v=Number(p.value);
  if(v===q.a){score++;document.getElementById("opt"+i+"_"+v).classList.add("correct");document.getElementById("fb"+i).textContent="Betul ✓"}
  else{document.getElementById("opt"+i+"_"+v).classList.add("wrong");document.getElementById("opt"+i+"_"+q.a).classList.add("correct");document.getElementById("fb"+i).textContent="Salah ✗ • Jawapan betul: "+String.fromCharCode(65+q.a)}
 });
 const pct=Math.round(score/20*100),dur=Math.min(DURATION,Math.round((Date.now()-startAt)/1000));
 const rec={name:currentName,class:currentClass,set:"SET 3",score,total:20,pct,duration_seconds:dur,timed_out:auto,unanswered:blank};
 try{await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)})}catch(e){}
 submitBtn.disabled=true;
 result.classList.remove("hidden");
 result.innerHTML=`<div class="result"><div><b>${auto?"Masa tamat — jawapan dihantar secara automatik.":"Semakan selesai."}</b></div><div class="big">${score} / 20</div><div>${pct}%</div><p>${blank} soalan tidak dijawab.</p><p class="note">Jalan kerja dipaparkan di bawah setiap soalan.</p></div>`;
 result.scrollIntoView({behavior:"smooth"});
}
init();
</script>
</body></html>
