<!doctype html><html lang='ms'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Latihan SPM Insurans & Kewangan</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:#17365d;padding:16px}.box{width:min(640px,96vw);background:#fff;padding:22px;border-radius:18px}.box select,.box button{width:100%;padding:11px;margin-top:9px;border-radius:9px;font:inherit}.box select{border:1px solid #cbd5e1}.box button{border:0;background:#17365d;color:#fff;font-weight:900}.app{height:100vh;display:flex;flex-direction:column}.top{background:#17365d;color:#fff;padding:10px}.body{flex:1;overflow:auto;padding:12px}.q{max-width:940px;margin:auto;background:#fff;padding:16px;border-radius:14px}.meta{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#eef2ff;color:#3730a3}.badge.green{background:#ecfdf3;color:#166534}.stem{margin-top:10px;background:#f8fafc;border-left:5px solid #17365d;padding:12px;border-radius:8px;line-height:1.55}.hint{margin-top:10px;background:#fff7ed;border:1px solid #fed7aa;padding:9px;border-radius:9px;font-size:12px}.steps{display:grid;gap:10px;margin-top:14px}.step{border:1px solid #dbe3ec;border-radius:10px;padding:11px}.step label{display:block;font-weight:700;margin-bottom:7px}.step input{width:260px;max-width:100%;padding:9px;border:2px solid #94a3b8;border-radius:8px;font-size:16px}.step.correct{border-color:#16a34a;background:#ecfdf3}.step.wrong{border-color:#dc2626;background:#fff1f2}.scheme{margin-top:14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px}.foot{display:grid;grid-template-columns:105px 1fr 105px;gap:7px;padding:7px;background:#fff}.foot button{border:0;border-radius:9px;padding:10px;font-weight:900}.prev{background:#e2e8f0}.next{background:#1d4ed8;color:#fff}.submit{background:#166534;color:#fff}.result{max-width:940px;margin:8px auto;background:#eff6ff;padding:14px;border-radius:10px;text-align:center}.big{font-size:34px;font-weight:900;color:#1d4ed8}
</style></head><body>
<div id='login' class='login'><div class='box'><h2>LATIHAN SPM • INSURANS & KEWANGAN</h2><p>16 soalan • 51 markah • Aras rendah hingga sederhana<br>Gaya Kertas 2 SPM: pengiraan + keputusan + justifikasi.</p><select id='classInput'><option value=''>-- Pilih kelas --</option></select><select id='nameInput' disabled><option value=''>-- Pilih nama murid --</option></select><button id='startBtn'>MULA</button></div></div>
<div id='app' class='app hidden'><div class='top'><b id='title'></b><span id='who'></span></div><div id='body' class='body'></div><div class='foot'><button id='prevBtn' class='prev'>←</button><button id='submitBtn' class='submit'>SEMAK & HANTAR</button><button id='nextBtn' class='next'>→</button></div></div>
<script>
const STUDENTS=[{"name": "SAM ZHI KHOI", "className": "EMERALD"}, {"name": "ZULAIKA BINTI SULAIMAN", "className": "DIAMOND"}, {"name": "CHONG JIN TONG", "className": "DIAMOND"}, {"name": "MUHAMMAD SYAHMI ADHA BIN ZAMRI", "className": "DIAMOND"}, {"name": "VANNESA CHONG TING EN", "className": "EMERALD"}, {"name": "SAFIYA AUNI BINTI SAIFUL LIZAN", "className": "DIAMOND"}, {"name": "NUR SYAMILA BINTI MOHD FARID", "className": "DIAMOND"}, {"name": "MUHAMMAD ZAID BIN MUSTAPA", "className": "DIAMOND"}, {"name": "MUHAMMAD ZEYN NIFAIL BIN ZAINAL", "className": "DIAMOND"}, {"name": "SIM ZI HANG", "className": "SAPPHIRE"}, {"name": "SELINA TAN QI ROU", "className": "DIAMOND"}, {"name": "HEU CHIA NEE", "className": "EMERALD"}, {"name": "KAMALIA DARWISYAH BINTI AZHAN", "className": "EMERALD"}, {"name": "IZZI HALEEF BIN AZALI", "className": "DIAMOND"}, {"name": "MUHAMMAD DARWISY AHNA BIN MAZLAN", "className": "DIAMOND"}];const QUESTIONS=[{"id": "q1", "section": "Insurans", "title": "Kemalangan Diri", "level": "Rendah", "stem": "Encik Razak membeli polisi bernilai RM400 000 dengan premium RM150 sebulan. Polisi melindungi risiko kemalangan diri.", "steps": [["text", "Nyatakan jenis perlindungan:", ["kemalangan diri", "insurans kemalangan diri"]], ["number", "Premium tahunan = RM150 × 12 = RM", 1800]], "scheme": ["Kemalangan diri", "RM1 800"]}, {"id": "q2", "section": "Insurans", "title": "Perubatan: Deduktibel", "level": "Rendah", "stem": "Kos rawatan hospital ialah RM18 000. Polisi mempunyai deduktibel RM500 dan tiada ko-insurans.", "steps": [["number", "Kos selepas deduktibel = RM18 000 − RM500 = RM", 17500], ["number", "Bayaran syarikat insurans = RM", 17500]], "scheme": ["RM17 500", "RM17 500"]}, {"id": "q3", "section": "Insurans", "title": "Perubatan: Ko-insurans", "level": "Sederhana", "stem": "Polisi Mira mempunyai deduktibel RM1 000 dan ko-insurans 80/20. Kos rawatan yang dilindungi ialah RM31 000.", "steps": [["number", "Kos selepas deduktibel = RM31 000 − RM1 000 = RM", 30000], ["number", "Bahagian Mira = 20% × RM30 000 = RM", 6000], ["number", "Jumlah Mira bayar = RM1 000 + RM6 000 = RM", 7000], ["number", "Syarikat insurans bayar = RM31 000 − RM7 000 = RM", 24000]], "scheme": ["RM30 000", "RM6 000", "RM7 000", "RM24 000"]}, {"id": "q4", "section": "Insurans", "title": "Penyakit Kritikal", "level": "Sederhana", "stem": "Nilai muka polisi asas Puan Hawa ialah RM400 000. Perlindungan penyakit kritikal ialah 25% dengan kadar premium RM1.73 bagi setiap RM1 000 perlindungan.", "steps": [["number", "Perlindungan penyakit kritikal = 25% × RM400 000 = RM", 100000], ["number", "Bilangan unit RM1 000 =", 100], ["number", "Premium penyakit kritikal = 100 × RM1.73 = RM", 173]], "scheme": ["RM100 000", "100 unit", "RM173"]}, {"id": "q5", "section": "Insurans", "title": "Perjalanan", "level": "Rendah", "stem": "Premium satu perjalanan ialah RM120. Premium tahunan ialah RM300. Sebuah keluarga membuat 3 perjalanan setahun.", "steps": [["number", "Kos 3 perjalanan = 3 × RM120 = RM", 360], ["number", "Penjimatan premium tahunan = RM360 − RM300 = RM", 60], ["text", "Pilihan lebih sesuai:", ["premium tahunan", "tahunan"]]], "scheme": ["RM360", "RM60", "Premium tahunan"]}, {"id": "q6", "section": "Insurans", "title": "Kebakaran / Harta", "level": "Sederhana", "stem": "Nilai boleh insurans sebuah rumah ialah RM500 000. Polisi menetapkan ko-insurans 70%.", "steps": [["number", "Jumlah insurans yang harus dibeli = 70% × RM500 000 = RM", 350000], ["number", "Jika hanya membeli RM300 000, kekurangan perlindungan = RM", 50000]], "scheme": ["RM350 000", "RM50 000"]}, {"id": "q7", "section": "Insurans", "title": "Motor dan NCD", "level": "Sederhana", "stem": "Premium asas insurans motor ialah RM1 600. Pemilik layak menerima NCD 55%.", "steps": [["number", "Diskaun NCD = 55% × RM1 600 = RM", 880], ["number", "Premium selepas NCD = RM1 600 − RM880 = RM", 720], ["text", "NCD bermaksud:", ["no claim discount", "diskaun tanpa tuntutan", "diskaun tiada tuntutan"]]], "scheme": ["RM880", "RM720", "No Claim Discount / Diskaun Tanpa Tuntutan"]}, {"id": "q8", "section": "Kewangan", "title": "SMART", "level": "Rendah", "stem": "Lengkapkan lima komponen utama matlamat kewangan SMART.", "steps": [["text", "S =", ["specific", "khusus"]], ["text", "M =", ["measurable", "boleh diukur"]], ["text", "A =", ["attainable", "boleh dicapai"]], ["text", "R =", ["realistic", "realistik", "bersifat realistik"]], ["text", "T =", ["time-bound", "tempoh masa", "bertempoh"]]], "scheme": ["Specific / Khusus", "Measurable / Boleh diukur", "Attainable / Boleh dicapai", "Realistic / Realistik", "Time-bound / Tempoh masa"]}, {"id": "q9", "section": "Kewangan", "title": "Aliran Tunai Asas", "level": "Rendah", "stem": "Pendapatan bulanan Aina ialah RM4 500 dan jumlah perbelanjaan ialah RM3 200.", "steps": [["number", "Aliran tunai = RM4 500 − RM3 200 = RM", 1300], ["text", "Jenis aliran tunai:", ["positif", "aliran tunai positif"]]], "scheme": ["RM1 300", "Positif"]}, {"id": "q10", "section": "Kewangan", "title": "Aliran Tunai SPM", "level": "Sederhana", "stem": "Puan Salina mempunyai pendapatan aktif RM6 800 dan pendapatan pasif RM450 sebulan. Beliau menyimpan 10% daripada jumlah pendapatan. Perbelanjaan tetap ialah RM2 750 dan perbelanjaan tidak tetap ialah RM1 900.", "steps": [["number", "Jumlah pendapatan = RM6 800 + RM450 = RM", 7250], ["number", "Simpanan tetap = 10% × RM7 250 = RM", 725], ["number", "Jumlah aliran keluar = RM725 + RM2 750 + RM1 900 = RM", 5375], ["number", "Aliran tunai = RM7 250 − RM5 375 = RM", 1875], ["text", "Jenis aliran tunai:", ["positif", "aliran tunai positif"]]], "scheme": ["RM7 250", "RM725", "RM5 375", "RM1 875", "Aliran tunai positif"]}, {"id": "q11", "section": "Kewangan", "title": "Faedah Mudah", "level": "Rendah", "stem": "RM5 000 disimpan pada kadar faedah mudah 4% setahun selama 3 tahun.", "steps": [["number", "Jumlah faedah = RM5 000 × 4% × 3 = RM", 600], ["number", "Jumlah akhir = RM", 5600]], "scheme": ["RM600", "RM5 600"]}, {"id": "q12", "section": "Kewangan", "title": "Kad Kredit", "level": "Sederhana", "stem": "Baki kad kredit ialah RM5 400. Bayaran minimum ialah 5% daripada baki.", "steps": [["number", "Bayaran minimum = 5% × RM5 400 = RM", 270], ["number", "Baki selepas bayaran minimum = RM", 5130], ["text", "Bayaran minimum yang kecil menyebabkan hutang mengambil masa lebih lama. Benar atau Palsu:", ["benar"]]], "scheme": ["RM270", "RM5 130", "Benar"]}, {"id": "q13", "section": "Kewangan", "title": "Pinjaman Asas", "level": "Sederhana", "stem": "Puan Lina meminjam RM24 000 untuk 5 tahun pada kadar faedah sama rata 5% setahun.", "steps": [["number", "Jumlah faedah = RM24 000 × 5% × 5 = RM", 6000], ["number", "Jumlah bayaran balik = RM", 30000], ["number", "Ansuran bulanan = RM30 000 ÷ 60 = RM", 500]], "scheme": ["RM6 000", "RM30 000", "RM500 sebulan"]}, {"id": "q14", "section": "Kewangan", "title": "Pemilihan Antara Dua Bank", "level": "Sederhana", "stem": "Pn Hasnah mahu meminjam RM30 000. Bank Sejahtera menawarkan kadar faedah sama rata 4.8% setahun untuk 4 tahun. Bank Makmur menawarkan 5.2% setahun untuk 6 tahun. Pn Hasnah mampu membayar maksimum RM700 sebulan.", "steps": [["number", "Bank Sejahtera: faedah = RM30 000 × 4.8% × 4 = RM", 5760], ["number", "Bank Sejahtera: jumlah bayaran balik = RM", 35760], ["number", "Bank Sejahtera: ansuran bulanan = RM35 760 ÷ 48 = RM", 745], ["number", "Bank Makmur: faedah = RM30 000 × 5.2% × 6 = RM", 9360], ["number", "Bank Makmur: jumlah bayaran balik = RM", 39360], ["number", "Bank Makmur: ansuran bulanan = RM39 360 ÷ 72 = RM", 546.6666667], ["text", "Bank yang lebih sesuai:", ["bank makmur", "makmur"]], ["text", "Justifikasi:", ["ansuran bulanan lebih rendah", "ansuran kurang daripada rm700", "mampu dibayar", "ansuran lebih rendah"]]], "scheme": ["RM5 760", "RM35 760", "RM745.00", "RM9 360", "RM39 360", "RM546.67", "Bank Makmur", "Ansuran bulanan lebih rendah dan tidak melebihi RM700"]}, {"id": "q15", "section": "Kewangan", "title": "Pelaburan", "level": "Sederhana", "stem": "Sebuah pelaburan RM10 000 menghasilkan keuntungan RM1 500.", "steps": [["number", "Kadar pulangan = RM1 500 ÷ RM10 000 × 100% =", 15], ["number", "Nilai akhir pelaburan = RM", 11500]], "scheme": ["15%", "RM11 500"]}, {"id": "q16", "section": "Kewangan", "title": "Pelan Kewangan", "level": "Rendah", "stem": "Lengkapkan dua langkah proses pengurusan kewangan.", "steps": [["text", "Selepas menilai kedudukan kewangan:", ["mewujudkan pelan kewangan", "menyediakan pelan kewangan", "pelan kewangan"]], ["text", "Selepas melaksanakan pelan kewangan:", ["mengkaji semula dan menyemak kemajuan", "mengkaji semula", "menyemak kemajuan"]]], "scheme": ["Mewujudkan pelan kewangan", "Mengkaji semula dan menyemak kemajuan"]}];const A={};let i=0,submitted=false,student='',cls='';
const classInput=document.getElementById('classInput'),nameInput=document.getElementById('nameInput');
const norm=s=>String(s??'').toLowerCase().trim().replace(/\s+/g,' ');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function init(){const cs=[...new Set(STUDENTS.map(s=>s.className))].sort();classInput.innerHTML='<option value="">-- Pilih kelas --</option>'+cs.map(c=>`<option>${c}</option>`).join('');classInput.onchange=()=>{const c=classInput.value,list=STUDENTS.filter(s=>s.className===c).sort((a,b)=>a.name.localeCompare(b.name));nameInput.innerHTML='<option value="">-- Pilih nama murid --</option>'+list.map(s=>`<option>${esc(s.name)}</option>`).join('');nameInput.disabled=!c}}
function k(q,j){return q.id+'_'+j}function v(q,j){return A[k(q,j)]??''}
function ok(step,val){if(step[0]==='number'){const n=Number(val);return !Number.isNaN(n)&&Math.abs(n-Number(step[2]))<=0.02}return step[2].some(a=>norm(val)===norm(a))}
function render(){const q=QUESTIONS[i];title.textContent=q.section+' • '+q.title;body.innerHTML=`<div class="q"><div class="meta"><span class="badge">${q.section}</span><span class="badge green">${q.level}</span><span class="badge">${q.steps.length} markah</span></div><div class="stem">${q.stem}</div><div class="hint">💡 Isi ikut urutan skema. Masukkan nombor sahaja untuk nilai RM/%.</div><div class="steps">${q.steps.map((s,j)=>{const val=v(q,j),cl=submitted?(ok(s,val)?'correct':'wrong'):'';return `<div class="step ${cl}"><label>(${String.fromCharCode(97+j)}) ${s[1]}</label><input type="${s[0]==='number'?'number':'text'}" step="any" data-key="${k(q,j)}" value="${esc(val)}" ${submitted?'disabled':''}></div>`}).join('')}</div>${submitted?`<div class="scheme"><b>Skema Jawapan</b><ol>${q.scheme.map(x=>`<li>${x}</li>`).join('')}</ol></div>`:''}</div>`;if(!submitted)body.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>A[el.dataset.key]=el.value);prevBtn.disabled=i===0;nextBtn.disabled=i===QUESTIONS.length-1}
function grade(){let score=0;QUESTIONS.forEach(q=>q.steps.forEach((s,j)=>{if(ok(s,A[k(q,j)]))score++}));return {score,total:51,pct:score/51*100}}
function save(r){google.script.run.withFailureHandler(err=>console.error(err)).saveInsuranceFinance({name:student,className:cls,setName:'INSURANS & KEWANGAN SPM V2',answers:A,score:r.score,total:r.total,pct:r.pct})}
function submit(){if(submitted)return;if(!confirm('Semak dan hantar jawapan?'))return;submitted=true;const r=grade();save(r);render();const x=document.createElement('div');x.className='result';x.innerHTML=`<b>SEMAKAN SELESAI</b><div class="big">${r.score} / ${r.total}</div><b>${r.pct.toFixed(1)}%</b><p>Gunakan butang kiri/kanan untuk melihat skema.</p>`;body.prepend(x);submitBtn.disabled=true}
startBtn.onclick=()=>{student=nameInput.value;cls=classInput.value;if(!student||!cls)return alert('Pilih kelas dan nama.');login.classList.add('hidden');app.classList.remove('hidden');who.textContent=` • ${student} • ${cls}`;render()};prevBtn.onclick=()=>{if(i>0){i--;render()}};nextBtn.onclick=()=>{if(i<QUESTIONS.length-1){i++;render()}};submitBtn.onclick=submit;init();
</script></body></html>
