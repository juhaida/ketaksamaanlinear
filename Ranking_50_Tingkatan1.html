<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50 Ranking Terbaik Matematik Tingkatan 1</title>
<style>
:root{--gold:#d4a017;--silver:#aeb4bd;--bronze:#b87333;--ink:#17212b;--muted:#687481;--bg:#f4f7fb;--card:#fff;--line:#e1e8ef}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#0b3d68,#145da0);color:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:0 5px 18px #0002}
.hero h1{margin:0 0 6px;font-size:1.45rem}.hero p{margin:3px 0;opacity:.95;font-size:.92rem}
.update{margin-top:8px;font-size:.8rem;opacity:.85}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:16px 0}
.place{background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:center;padding:14px 10px 12px;box-shadow:0 3px 10px #0001;overflow-wrap:anywhere}
.place.first{min-height:245px;border-top:6px solid var(--gold)}.place.second{min-height:220px;border-top:6px solid var(--silver)}.place.third{min-height:205px;border-top:6px solid var(--bronze)}
.trophy{font-size:56px;line-height:1;margin:4px 0 8px}.first .trophy{font-size:68px}
.name{font-weight:900;font-size:1rem;line-height:1.25}.class{font-size:.82rem;color:var(--muted);margin-top:4px}
.score{font-weight:900;font-size:1.2rem;margin-top:8px}.time{font-size:.78rem;color:var(--muted);margin-top:3px}
.ribbon{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:999px;font-size:.78rem;font-weight:800}
.first .ribbon{background:#fff4c7;color:#8b6500}.second .ribbon{background:#eef1f4;color:#59616a}.third .ribbon{background:#f6e3d3;color:#8b4d1d}
.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 10px #0001}
.list-title{padding:14px;font-weight:900;background:#eaf1f9;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 100px 90px;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}.rank{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff6d8;font-weight:900;color:#926b00}
.student{min-width:0}.student .nm{font-weight:800;overflow-wrap:anywhere}.student .cl{font-size:.78rem;color:var(--muted);margin-top:2px}
.marks{text-align:center;font-weight:900}.tm{text-align:right;font-size:.8rem;color:var(--muted)}
.notice{text-align:center;color:var(--muted);font-size:.85rem;margin:12px 4px}
.error{background:#fff1f1;color:#9b1c1c;border:1px solid #f3c6c6;border-radius:12px;padding:12px;margin:14px 0;display:none}
.loading{text-align:center;padding:24px;color:var(--muted)}
@media(max-width:650px){.wrap{padding:8px}.hero{border-radius:15px;padding:14px 10px}.hero h1{font-size:1.15rem}.podium{gap:6px;margin:10px 0}.place{padding:10px 5px}.place.first{min-height:225px}.place.second{min-height:205px}.place.third{min-height:195px}.trophy{font-size:44px}.first .trophy{font-size:54px}.name{font-size:.82rem}.class{font-size:.72rem}.score{font-size:1rem}.ribbon{font-size:.68rem;padding:4px 7px}.row{grid-template-columns:40px minmax(0,1fr) 65px 57px;gap:5px;padding:10px 7px}.rank{width:32px;height:32px}.student .nm{font-size:.82rem}.student .cl,.tm{font-size:.7rem}.marks{font-size:.78rem}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>🏆 RANKING MATEMATIK TINGKATAN 1</h1>
    <p>50 pelajar terbaik keseluruhan tingkatan</p>
    <p>Terbuka kepada semua kelas Tingkatan 1 tanpa kuota kelas</p>
    <div class="update" id="lastUpdate">Memuatkan ranking...</div>
  </section>
  <div id="errorBox" class="error" role="alert"></div>
  <div id="loading" class="loading">Sedang mendapatkan ranking terkini...</div>
  <section id="rankingArea" style="display:none">
    <div class="podium" id="podium"></div>
    <div class="list" id="rankingList"></div>
    <div class="notice">Ranking menggunakan markah terbaik setiap murid. Jika markah sama, masa menjawab lebih singkat didahulukan.</div>
  </section>
</div>
<script>
'use strict';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6QK1m9Xt4I3NGWFB5J7vwpBIkUkmBnM9xiQOfNQ6JwC5WkpeR_zeHYJ1ZHWF78zFI/exec';
const SET_NAME = 'UASA Matematik Tingkatan 1 - Revision Paper 2023';
const MAX_RANKING = 50;
let loadingRequest = false;

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function secText(seconds){
  const n = Number(seconds);
  if(!Number.isFinite(n) || n <= 0) return 'Masa: —';
  const s = Math.round(n);
  return `${Math.floor(s/60)}m ${s%60}s`;
}
function scoreText(item){return `${escapeHTML(item.markah ?? '—')}/${escapeHTML(item.jumlah ?? '—')}`;}
function podiumCard(item,place){
  const cfg={1:{cls:'first',trophy:'🏆',ribbon:'JUARA'},2:{cls:'second',trophy:'🥈',ribbon:'NAIB JUARA'},3:{cls:'third',trophy:'🥉',ribbon:'TEMPAT KETIGA'}}[place];
  return `<div class="place ${cfg.cls}"><div class="trophy">${cfg.trophy}</div><div class="name">${escapeHTML(item.nama)}</div><div class="class">${escapeHTML(item.kelas)}</div><div class="score">${scoreText(item)}</div><div class="time">${secText(item.masaSaat)}</div><div class="ribbon">${cfg.ribbon}</div></div>`;
}
function normalRow(item,index){
  return `<div class="row"><div class="rank">${index+1}</div><div class="student"><div class="nm">${escapeHTML(item.nama)}</div><div class="cl">${escapeHTML(item.kelas)}</div></div><div class="marks">${scoreText(item)}</div><div class="tm">${secText(item.masaSaat)}</div></div>`;
}
function renderRanking(records){
  const items=records.slice(0,MAX_RANKING);
  const podium=document.getElementById('podium');
  const list=document.getElementById('rankingList');
  if(!items.length){podium.innerHTML='';list.innerHTML='<div class="loading">Belum ada rekod markah.</div>';return;}
  podium.innerHTML=[items[1]?podiumCard(items[1],2):'<div></div>',items[0]?podiumCard(items[0],1):'<div></div>',items[2]?podiumCard(items[2],3):'<div></div>'].join('');
  list.innerHTML=`<div class="list-title">Kedudukan 4–50 • ${Math.max(0,items.length-3)} pelajar</div>`+(items.length>3?items.slice(3).map((item,i)=>normalRow(item,i+3)).join(''):'<div class="loading">Belum ada pelajar di kedudukan 4 dan seterusnya.</div>');
}
// JSONP: boleh dibaca dari GitHub Pages tanpa fetch CORS.
function requestJSONP(url){
  return new Promise((resolve,reject)=>{
    const callback='ranking50Callback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const script=document.createElement('script');
    let completed=false;
    const timer=setTimeout(()=>finish(new Error('Sambungan mengambil masa terlalu lama. Semak URL dan deployment Apps Script.')),15000);
    function finish(error,data){
      if(completed)return;
      completed=true;
      clearTimeout(timer);
      delete window[callback];
      script.remove();
      if(error)reject(error);else resolve(data);
    }
    window[callback]=data=>finish(null,data);
    script.onerror=()=>finish(new Error('Tidak dapat menghubungi Apps Script. Pastikan akses deployment ialah Anyone.'));
    script.src=url+(url.includes('?')?'&':'?')+'callback='+encodeURIComponent(callback)+'&_t='+Date.now();
    document.head.appendChild(script);
  });
}
async function loadRanking(){
  if(loadingRequest)return;
  loadingRequest=true;
  const loading=document.getElementById('loading');
  const area=document.getElementById('rankingArea');
  const err=document.getElementById('errorBox');
  try{
    err.style.display='none';
    const url=SCRIPT_URL+'?action=ranking50&set='+encodeURIComponent(SET_NAME);
    const data=await requestJSONP(url);
    if(!data || !data.ok)throw new Error(data?.message || 'Gagal mendapatkan ranking.');
    const records=Array.isArray(data.top50)?data.top50:(Array.isArray(data.top20)?data.top20:null);
    if(!records)throw new Error('Respons tidak mengandungi top50. Sila deploy versi Apps Script yang baharu.');
    renderRanking(records);
    area.style.display='block';
    loading.style.display='none';
    document.getElementById('lastUpdate').textContent='Dikemas kini: '+new Date().toLocaleString('ms-MY');
  }catch(error){
    loading.style.display='none';
    err.textContent='Ranking tidak dapat dimuatkan. '+error.message;
    err.style.display='block';
  }finally{loadingRequest=false;}
}
loadRanking();
setInterval(loadRanking,60000);
</script>
</body>
</html>
