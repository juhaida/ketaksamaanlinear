<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top 3 Sekolah PPD Kulai</title>
<style>
:root{
  --ink:#172033;
  --muted:#667085;
  --line:#ead9b8;
  --card:#fffaf0;
  --accent:#b87900;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
}
.widget{
  width:min(520px,96vw);
  margin:6px auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 5px 16px rgba(60,45,20,.10);
  padding:12px;
}
.head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}
.title{
  font-size:16px;
  line-height:1.2;
  font-weight:900;
}
.sub{
  margin-top:2px;
  font-size:10px;
  color:var(--muted);
}
.badge{
  white-space:nowrap;
  font-size:9px;
  font-weight:800;
  color:#7a4b00;
  background:#fff1cf;
  border:1px solid #efd28e;
  border-radius:999px;
  padding:4px 7px;
}
.status{
  font-size:10px;
  color:#8a7449;
  margin:3px 0 8px;
}
.error{
  display:none;
  font-size:10px;
  color:#b42318;
  background:#fff1f0;
  border:1px solid #f2b8b5;
  border-radius:8px;
  padding:7px;
  margin-bottom:8px;
}
.list{
  display:grid;
  gap:7px;
}
.row{
  display:grid;
  grid-template-columns:52px 1fr auto;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid #eee2c8;
  border-radius:11px;
  padding:7px 9px;
  min-height:62px;
}
.medal{
  width:46px;
  height:46px;
  object-fit:contain;
  display:block;
  margin:auto;
}
.school{
  min-width:0;
}
.name{
  font-size:12px;
  line-height:1.25;
  font-weight:900;
  word-break:break-word;
}
.meta{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}
.score{
  text-align:right;
  min-width:58px;
}
.pct{
  font-size:13px;
  font-weight:900;
  color:#7a4b00;
}
.ranklabel{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}
.empty{
  text-align:center;
  color:#8c7b5d;
  font-size:11px;
  padding:18px 8px;
}
.footer{
  margin-top:7px;
  font-size:8.5px;
  color:#8c7b5d;
  text-align:right;
}
@media(max-width:420px){
  .widget{padding:10px}
  .title{font-size:15px}
  .row{grid-template-columns:46px 1fr auto;padding:6px 7px}
  .medal{width:42px;height:42px}
  .name{font-size:11.5px}
  .pct{font-size:12px}
}
</style>
</head>
<body>
<div class="widget">
  <div class="head">
    <div>
      <div class="title">🏆 Top 3 Sekolah PPD Kulai</div>

    <div class="badge">KULAI</div>
  </div>

  <div id="status" class="status">Mengemas kini ranking...</div>
  <div id="error" class="error"></div>
  <div id="list" class="list">
    <div class="empty">Memuatkan data...</div>
  </div>
  <div class="footer">Hanya sekolah dengan murid lengkap 4 set • auto refresh</div>
</div>

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function receiveTopKulai(data){
  const list=document.getElementById("list");
  const err=document.getElementById("error");
  err.style.display="none";

  if(!Array.isArray(data)){
    err.textContent=(data&&data.message)?data.message:"Data ranking tidak sah.";
    err.style.display="block";
    list.innerHTML='<div class="empty">Ranking belum dapat dipaparkan.</div>';
    return;
  }

  const top3=data.slice(0,3);

  if(!top3.length){
    list.innerHTML='<div class="empty">Belum ada sekolah dengan murid lengkap keempat-empat set.</div>';
  }else{
    list.innerHTML=top3.map((r,i)=>{
      const rank=i+1;
      return `
        <div class="row">
          <img class="medal" src="${MEDALS[rank]}" alt="Tempat ${rank}">
          <div class="school">
            <div class="name">${esc(r.school)}</div>
            <div class="meta">${esc(r.schoolCode||"")} • ${Number(r.students||0)} murid lengkap</div>
          </div>
          <div class="score">
            <div class="pct">${Number(r.avgPct||0).toFixed(2)}%</div>
            <div class="ranklabel">Tempat ${rank}</div>
          </div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("status").textContent=
    "Dikemas kini: "+new Date().toLocaleTimeString("ms-MY");
}

function loadTopKulai(){
  document.getElementById("status").textContent="Mengemas kini ranking...";
  const old=document.getElementById("rankJsonp");
  if(old) old.remove();

  const s=document.createElement("script");
  s.id="rankJsonp";
  s.src=WEB_APP_URL+
    "?mode=schools&ppd=KULAI"+
    "&callback=receiveTopKulai"+
    "&t="+Date.now();

  s.onerror=function(){
    const err=document.getElementById("error");
    err.style.display="block";
    err.textContent="Sambungan Apps Script gagal.";
    document.getElementById("status").textContent="Gagal mengemas kini ranking.";
  };

  document.body.appendChild(s);
}

loadTopKulai();
setInterval(loadTopKulai,15000);
</script>
