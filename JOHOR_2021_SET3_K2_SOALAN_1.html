<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dbe3ee;--blue:#164e8a;--good:#15803d;--bad:#b42318;}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.hidden{display:none!important} button,input,select{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#0b2a47,#164e8a)}
.loginbox{width:min(520px,96vw);background:#fff;padding:22px;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.loginbox h1{margin:0 0 6px;font-size:24px} .loginbox p{color:var(--muted);font-size:13px}
.loginbox input,.loginbox select,.loginbox button{width:100%;padding:11px;margin-top:8px;border-radius:10px}
.loginbox input,.loginbox select{border:1px solid #cbd5e1;background:#fff} .loginbox button{border:0;background:var(--blue);color:#fff;font-weight:900}
.app{height:100dvh;display:flex;flex-direction:column} .top{background:linear-gradient(135deg,#0b2a47,#164e8a);color:#fff;padding:9px 12px}
.toprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap} .brand{font-weight:900;flex:1} .pill{background:rgba(255,255,255,.15);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}
.main{flex:1;min-height:0;padding:7px} .card{height:100%;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
.head{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px} .qtitle{font-weight:900;flex:1} .counter{font-size:11px;color:var(--muted);font-weight:900}
.body{flex:1;min-height:0;overflow:auto;padding:11px} .question{max-width:850px;margin:auto;line-height:1.55;font-size:14px}
.diagram{max-width:520px;margin:10px auto} .diagram img{width:100%;height:auto;display:block;border:1px solid #e2e8f0;border-radius:10px}
.data-table{border-collapse:collapse;width:100%;margin:10px 0;font-size:12px} .data-table th,.data-table td{border:1px solid #64748b;padding:7px;text-align:center}
.field{margin:10px 0} .field label{display:block;font-weight:900;margin-bottom:5px} .hint{font-weight:400;color:var(--muted);font-size:11px}
.ans{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff} .ans.correct{border-color:#16a34a;background:#ecfdf3} .ans.wrong{border-color:#dc2626;background:#fff1f2}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mathline{text-align:center;font-size:17px} .frac{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1} .frac span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.frac-answer{display:inline-grid;grid-template-rows:36px 2px 36px;width:90px} .frac-answer span{background:#172033} .frac-answer input{text-align:center}
.venn{position:relative;height:230px;border:2px solid #334155;border-radius:8px;margin:12px 0;background:#fafcff} .venn-label{position:absolute;top:5px;left:8px;font-weight:900} .circle{position:absolute;width:145px;height:145px;border:2px solid #1d4ed8;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;padding:34px 12px 10px;text-align:center}
.venn-input{position:absolute;width:180px!important;font-size:12px} .venn-input.inside{position:static;width:110px!important} .venn-input.outside{right:14px;bottom:14px}
.keypad{display:flex;flex-wrap:wrap;gap:5px;max-width:850px;margin:8px auto;padding:8px;background:#eef4fb;border:1px solid #d8e3ef;border-radius:10px;position:sticky;bottom:0;z-index:5} .keypad button{border:1px solid #b8cae0;background:#fff;border-radius:7px;padding:7px 9px;font-weight:900;color:#123b67}
.scheme{max-width:850px;margin:12px auto;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px;line-height:1.55} .scheme h3{margin:0 0 8px;color:#166534} .note{font-size:11px;color:#64748b}
.scheme-venn{position:relative;height:170px;border:2px solid #64748b;border-radius:8px;margin-top:8px} .sv-l{position:absolute;top:5px;left:8px;font-weight:900} .sv-k{position:absolute;left:34%;top:50%;transform:translate(-50%,-50%);width:115px;height:115px;border:2px solid #1d4ed8;border-radius:50%;display:grid;place-items:center;text-align:center} .sv-out{position:absolute;right:12px;bottom:25px;width:45%;text-align:center}
.result{max-width:850px;margin:10px auto;padding:13px;border-radius:12px;background:#eff6ff;text-align:center} .big{font-size:32px;font-weight:900;color:#1d4ed8}
.footer{display:grid;grid-template-columns:105px 1fr 105px;gap:7px;padding:7px;background:#fff;border-top:1px solid var(--line)} .footer button{border:0;border-radius:9px;padding:10px;font-weight:900} .prev{background:#e2e8f0} .next{background:#1d4ed8;color:#fff} .submit{background:#166534;color:#fff}

k pintasan-x, y = 0: 2x = 16, maka <b>x = 8</b>.</p>\n"}, {"n": 7, "title": "Soalan 7 • Penaakulan Matematik", "marks": 5, "body": "\n<p>(a) Tentukan sama ada pernyataan majmuk berikut benar atau palsu:</p>\n<p class=\"mathline\">8<sup>-1</sup> = <span class=\"frac\"><span>1</span><span>8</span></span> dan 7 ialah faktor bagi 72.</p>\n<p>(b) Bina dua implikasi bagi:</p>\n<p><b>20% daripada 30 ialah 6 jika dan hanya jika 0.2 × 30 = 6.</b></p>\n<p>(c) Buat satu kesimpulan umum secara aruhan:</p>\n<p class=\"mathline\">12 = 4(1²)+8<br>24 = 4(2²)+8<br>44 = 4(3²)+8<br>72 = 4(4²)+8</p>\n", "answerHtml": "\n<div class=\"field\"><label>(a)</label><select class=\"ans\" data-key=\"q7a\"><option value=\"\">Pilih</option><option>Benar</option><option>Palsu</option></select></div>\n<div class=\"field\"><label>(b) Implikasi 1</label><input class=\"ans math-input\" data-key=\"q7b1\" placeholder=\"Jika ..., maka ...\"></div>\n<div class=\"field\"><label>(b) Implikasi 2</label><input class=\"ans math-input\" data-key=\"q7b2\" placeholder=\"Jika ..., maka ...\"></div>\n<div class=\"field\"><label>(c) Kesimpulan umum</label><input class=\"ans math-input\" data-key=\"q7c\" placeholder=\"contoh Tₙ = ...\"></div>\n", "scheme": "\n<p>(a) 8<sup>-1</sup> = 1/8 ialah benar, tetapi 7 bukan faktor 72. Benar DAN Palsu = <b>Palsu</b>.</p>\n<p>(b) Implikasi 1: <b>Jika 20% daripada 30 ialah 6, maka 0.2 × 30 = 6.</b></p>\n<p>Implikasi 2: <b>Jika 0.2 × 30 = 6, maka 20% daripada 30 ialah 6.</b></p>\n<p>(c) Pola sebutan ke-n ialah <b>Tₙ = 4n² + 8</b>.</p>\n"}, {"n": 8, "title": "Soalan 8 • Kebarangkalian", "marks": 5, "body": "\n<p>Jadual menunjukkan bilangan guli di dalam dua balang.</p>\n<table class=\"data-table\"><tr><th></th><th>Guli merah</th><th>Guli putih</th></tr><tr><th>Balang A</th><td>x</td><td>3</td></tr><tr><th>Balang B</th><td>4</td><td>8</td></tr></table>\n<p>(a) Cari nilai x jika kebarangkalian dua guli daripada balang berlainan mempunyai warna berlainan ialah <span class=\"frac\"><span>13</span><span>24</span></span>.</p>\n<p>(b) Cari kebarangkalian sekurang-kurangnya sebiji guli merah dipilih.</p>\n", "answerHtml": "\n<div class=\"field\"><label>(a) x =</label><input class=\"ans math-input\" data-key=\"q8a\"></div>\n<div class=\"field\"><label>(b) Kebarangkalian</label><div class=\"frac-answer\"><input class=\"ans\" data-key=\"q8bn\" inputmode=\"numeric\"><span></span><input class=\"ans\" data-key=\"q8bd\" inputmode=\"numeric\"></div></div>\n", "scheme": "\n<p>(a) P(warna berlainan) = P(A merah, B putih) + P(A putih, B merah)</p>\n<p>= x/(x+3) × 8/12 + 3/(x+3) × 4/12 = 13/24</p>\n<p>24(8x+12) = 156(x+3)<br>192x+288 = 156x+468<br>36x = 180<br><b>x = 5</b>.</p>\n<p>(b) P(sekurang-kurangnya satu merah) = 1 - P(kedua-dua putih)</p>\n<p>= 1 - (3/8 × 8/12) = 1 - 1/4 = <b>3/4</b>.</p>\n"}, {"n": 9, "title": "Soalan 9 • Graf Laju-Masa", "marks": 4, "body": "\n<p>Graf OP mewakili gerakan zarah H manakala graf OQRS mewakili zarah K dalam tempoh t saat.</p>\n<div class=\"diagram\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGkAqkDASIAAhEBAxEB/8QAHAABAAMBAQEBAQAAAAAAAAAAAAQFBgcDAgEI/8QAWxAAAQQBAgMDBggFDQwKAwEAAQACAwQFBhESITEHE0EUFRYiUWEyVFZxk5TR0ggjQoGRFzM2N0NSU2JjdaGzwRgkJWRyc5WjpLGytCY0NUZldIKSotN2wsPw/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/AP6pREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERB8TmVsLzAxj5QDwNe8taT4AkA7D37FZHsz7QZe0 H dan zarah K ialah 24 m. Hitung t.</p>\n", "answerHtml": "\n<div class=\"field\"><label>(a) Laju seragam K</label><input class=\"ans math-input\" data-key=\"q9a\" inputmode=\"decimal\"> m s⁻¹</div>\n<div class=\"field\"><label>(b) t =</label><input class=\"ans math-input\" data-key=\"q9b\" inputmode=\"decimal\"> s</div>\n", "scheme": "\n<p>(a) Daripada graf, laju seragam zarah K ialah <b>16 m s⁻¹</b>.</p>\n<p>(b) Pada t saat, laju H ialah 16 m s⁻¹ kerana OP melalui R.</p>\n<p>Jarak H = 1/2 × t × 16 = 8t.</p>\n<p>Jarak K = 1/2 × 12 × 16 + 16(t-12) = 96 + 16t - 192 = 16t - 96.</p>\n<p>Beza jarak = 24:<br>(16t - 96) - 8t = 24<br>8t = 120<br><b>t = 15 s</b>.</p>\n"}, {"n": 12, "title": "Soalan 12 • Min & Sisihan Piawai", "marks": 10, "body": "\n<p>Jadual menunjukkan markah kuiz Matematik bagi dua kelas.</p>\n<table class=\"data-table\"><tr><th>Markah</th><th>55-59</th><th>60-64</th><th>65-69</th><th>70-74</th><th>75-79</th><th>80-84</th></tr>\n<tr><th>Budiman</th><td>4</td><td>6</td><td>5</td><td>4</td><td>4</td><td>2</td></tr>\n<tr><th>Jujur</th><td>3</td><td>7</td><td>8</td><td>3</td><td>3</td><td>1</td></tr></table>\n<p>(i) Hitung min dan sisihan piawai bagi kedua-dua kelas.</p>\n<p>(ii) Kelas manakah menunjukkan prestasi lebih konsisten? Berikan justifikasi.</p>\n", "answerHtml": "\n<div class=\"two-col\">\n<div class=\"field\"><label>Min Budiman</label><input class=\"ans math-input\" data-key=\"q12bm\" inputmode=\"decimal\"></div>\n<div class=\"field\"><label>Sisihan piawai Budiman</label><input class=\"ans math-input\" data-key=\"q12bsd\" inputmode=\"decimal\"></div>\n<div class=\"field\"><label>Min Jujur</label><input class=\"ans math-input\" data-key=\"q12jm\" inputmode=\"decimal\"></div>\n<div class=\"field\"><label>Sisihan piawai Jujur</label><input class=\"ans math-input\" data-key=\"q12jsd\" inputmode=\"decimal\"></div>\n</div>\n<div class=\"field\"><label>(ii) Kelas lebih konsisten</label><select class=\"ans\" data-key=\"q12class\"><option value=\"\">Pilih</option><option>Budiman</option><option>Jujur</option></select></div>\n<div class=\"field\"><label>Justifikasi</label><input class=\"ans math-input\" data-key=\"q12reason\" placeholder=\"contoh: sisihan piawai ...\"></div>\n", "scheme": "\n<p>Titik tengah: 57, 62, 67, 72, 77, 82.</p>\n<p><b>Budiman:</b> Σf = 25, Σfx = 1695, Σfx² = 116405.</p>\n<p>Min = 1695/25 = <b>67.8</b>.</p>\n<p>σ = √(116405/25 - 67.8²) = <b>7.70</b> (2 t.p.).</p>\n<p><b>Jujur:</b> Σf = 25, Σfx = 1670, Σfx² = 112630.</p>\n<p>Min = 1670/25 = <b>66.8</b>.</p>\n<p>σ = √(112630/25 - 66.8²) = <b>6.55</b> (2 t.p.).</p>\n<p>(ii) <b>Kelas Jujur</b> lebih konsisten kerana sisihan piawainya lebih kecil.</p>\n"}, {"n": 15, "title": "Soalan 15 • Percukaian", "marks": 10, "body": "\n<p>Pendapatan tahunan Puan Fatimah ialah RM86 500. Pelepasan cukai: individu RM9 000, insurans hayat dan KWSP RM7 000, gaya hidup RM1 500, insurans perubatan RM2 500, rawatan perubatan ibu bapa RM2 200 dan seorang anak RM2 000. Zakat RM600.</p>\n<table class=\"data-table\"><tr><th>Banjaran pendapatan bercukai</th><th>Pengiraan</th><th>Kadar</th><th>Cukai</th></tr>\n<tr><td>50 001 - 70 000</td><td>50 000 pertama<br>20 000 berikutnya</td><td>-<br>14%</td><td>RM1 800<br>RM2 800</td></tr></table>\n<p>(a) Hitung pendapatan bercukai.</p>\n<p>(b) Hitung cukai pendapatan yang perlu dibayar.</p>\n<p>(c) Jika PCB RM230 ditolak setiap bulan, adakah perlu membayar baki cukai? Jelaskan.</p>\n", "answerHtml": "\n<div class=\"field\"><label>(a) Pendapatan bercukai (RM)</label><input class=\"ans math-input\" data-key=\"q15a\" inputmode=\"decimal\"></div>\n<div class=\"field\"><label>(b) Cukai pendapatan perlu dibayar selepas zakat (RM)</label><input class=\"ans math-input\" data-key=\"q15b\" inputmode=\"decimal\"></div>\n<div class=\"field\"><label>(c) Perlu bayar baki?</label><select class=\"ans\" data-key=\"q15cy\"><option value=\"\">Pilih</option><option>Ya</option><option>Tidak</option></select></div>\n<div class=\"field\"><label>Baki cukai (RM)</label><input class=\"ans math-input\" data-key=\"q15cb\" inputmode=\"decimal\"></div>\n", "scheme": "\n<p>(a) Jumlah pelepasan = 9000 + 7000 + 1500 + 2500 + 2200 + 2000 = RM24 200.</p>\n<p>Pendapatan bercukai = 86 500 - 24 200 = <b>RM62 300</b>.</p>\n<p>(b) Cukai sebelum rebat zakat = 1800 + (62 300 - 50 000) × 14% = 1800 + 1722 = RM3522.</p>\n<p>Cukai perlu dibayar = 3522 - 600 = <b>RM2922</b>.</p>\n<p>(c) PCB setahun = 230 × 12 = RM2760.</p>\n<p>Baki = 2922 - 2760 = <b>RM162</b>. Maka <b>Ya</b>, Puan Fatimah masih perlu membayar baki RM162.</p>\n"}, {"n": 16, "title": "Soalan 16 • Kewangan, Matriks, Laluan & Insurans", "marks": 15, "body": "\n<p>Encik Uwais telah mengumpulkan dana sebanyak RM5 000.</p>\n<p>(a) Dia menggunakan RM550 untuk kos pengangkutan. Cari peratus wang yang dibelanjakan dan baki dana.</p>\n<p>(b) Dia membeli 70 helai baju dan seluar. Harga baju RM22 dan seluar RM28. Bayaran ialah 40% daripada baki dalam (a). Cari bilangan baju dan seluar.</p>\n<p>(c) Lengkapkan laluan: Pasir Gudang melalui Bandar Seri Alam, Johor Jaya, Kampung Melayu Majidee dan akhirnya Pusat Seri Kenangan, Larkin.</p>\n<p>(d) Insurans motor: jumlah diinsuranskan RM120 000, umur kenderaan 6 tahun, kapasiti enjin 2400 cc, NCD 45%, kadar tarif motor RM372.60. Hitung premium tahunan polisi komprehensif.</p>\n", "answerHtml": "\n<div class=\"two-col\">\n<div class=\"field\"><label>(a) Peratus dibelanjakan</label><input class=\"ans math-input\" data-key=\"q16ap\" inputmode=\"decimal\"> %</div>\n<div class=\"field\"><label>(a) Baki dana (RM)</label><input class=\"ans math-input\" data-key=\"q16ab\" inputmode=\"decimal\"></div>\n<div class=\"field\"><label>(b) Bilangan baju</label><input class=\"ans math-input\" data-key=\"q16shirt\" inputmode=\"numeric\"></div>\n<div class=\"field\"><label>(b) Bilangan seluar</label><input class=\"ans math-input\" data-key=\"q16pants\" inputmode=\"numeric\"></div>\n</div>\n<div class=\"field\"><label>(c) Laluan</label><input class=\"ans math-input\" data-key=\"q16route\" placeholder=\"Pasir Gudang → ...\"></div>\n<div class=\"field\"><label>(d) Premium tahunan (RM)</label><input class=\"ans math-input\" data-key=\"q16d\" inputmode=\"decimal\"></div>\n", "scheme": "\n<p>(a) Peratus dibelanjakan = 550/5000 × 100% = <b>11%</b>. Baki = 5000 - 550 = <b>RM4450</b>.</p>\n<p>(b) 40% × 4450 = RM1780.</p>\n<p>Jika x = baju dan y = seluar:<br>x + y = 70<br>22x + 28y = 1780</p>\n<p>Penyelesaian memberi <b>x = 30 baju</b> dan <b>y = 40 seluar</b>.</p>\n<p>(c) <b>Pasir Gudang → Bandar Seri Alam → Johor Jaya → Kampung Melayu Majidee → Pusat Seri Kenangan, Larkin</b>.</p>\n<p>(d) Premium asas = RM372.60 + 119 × RM26 = RM3466.60.</p>\n<p>NCD 45% = 0.45 × 3466.60 = RM1559.97.</p>\n<p>Premium tahunan = 3466.60 - 1559.97 = <b>RM1906.63</b>.</p>\n<p class=\"note\">Skema (d) dibina berdasarkan kaedah premium komprehensif KSSM: kadar tarif bagi RM1 000 pertama + RM26 bagi setiap RM1 000 berikutnya, kemudian ditolak NCD.</p>\n"}];

function norm(s){return String(s??"").toLowerCase().replace(/\s+/g,"").replace(/[−–—]/g,"-").replace(/×/g,"*").replace(/rm/g,"").replace(/,/g,"").trim();}
function num(v){const n=Number(String(v??"").replace(/rm/ig,"").replace(/,/g,"").replace("%",""));return Number.isFinite(n)?n:NaN}
function near(v,t,tol=.06){const n=num(v);return Number.isFinite(n)&&Math.abs(n-t)<=tol}
function unorderedNums(v,expected){const a=String(v??"").match(/\d+/g)||[];return a.map(Number).sort((x,y)=>x-y).join(",")===expected.slice().sort((x,y)=>x-y).join(",")}
function subsetCheck(v){
 const s=String(v??"").replace(/\s+/g,"").replace(/Ø|{}/g,"∅");
 const req=["∅","{1}","{4}","{9}","{1,4}","{1,9}","{4,9}","{1,4,9}"];
 return req.every(x=>s.includes(x)) && (s.match(/\{/g)||[]).length>=7;
}
function containsAll(v,arr){const s=norm(v);return arr.every(x=>s.includes(norm(x)));}
function eq6(v){const s=norm(v).replace(/\*/g,"");return ["y=-2x+16","2x+y=16"].includes(s);}
function routeOK(v){return containsAll(v,["PasirGudang","BandarSeriAlam","JohorJaya","KampungMelayuMajidee","SeriKenangan"]);}

function grade(){
 let m=0;
 if(subsetCheck(state.q1a))m+=2;if(unorderedNums(state.q1bin,[1,4,9])&&unorderedNums(state.q1bout,[2,3,5,6,7,8,10]))m+=1;
 if(norm(state.q6a)==="x=3")m+=1;if(eq6(state.q6b1))m+=2;if(near(state.q6b2,8))m+=1;
 if(norm(state.q7a)==="palsu")m+=1;
 if(containsAll(state.q7b1,["jika","20%","30","6","maka","0.2","30","6"]))m+=1;
 if(containsAll(state.q7b2,["jika","0.2","30","6","maka","20%","30","6"]))m+=1;
 if(["tn=4n²+8","tₙ=4n²+8","tn=4n^2+8","4n²+8","4n^2+8"].includes(norm(state.q7c)))m+=2;
 if(near(state.q8a,5))m+=3;if(num(state.q8bn)===3&&num(state.q8bd)===4)m+=2;
 if(near(state.q9a,16))m+=1;if(near(state.q9b,15))m+=3;
 if(near(state.q12bm,67.8,.08))m+=2;if(near(state.q12bsd,7.70,.08))m+=2;if(near(state.q12jm,66.8,.08))m+=2;if(near(state.q12jsd,6.55,.08))m+=2;
 if(norm(state.q12class)==="jujur"&&containsAll(state.q12reason,["sisihan","piawai","kecil"]))m+=2;
 if(near(state.q15a,62300,.5))m+=3;if(near(state.q15b,2922,.5))m+=4;if(norm(state.q15cy)==="ya"&&near(state.q15cb,162,.5))m+=3;
 if(near(state.q16ap,11,.05))m+=1;if(near(state.q16ab,4450,.5))m+=1;if(near(state.q16shirt,30,.05))m+=2.5;if(near(state.q16pants,40,.05))m+=2.5;
 if(routeOK(state.q16route))m+=2;if(near(state.q16d,1906.63,.08))m+=6;
 return m;
}
