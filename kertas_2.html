IN OSMAN", "class": "SAPPHIRE"}, {"name": "MUHAMMAD HELMI BIN MAHADI", "class": "SAPPHIRE"}, {"name": "YONG LI LING", "class": "SAPPHIRE"}, {"name": "KHAIRUNNISA BINTI KOMARUDDIN", "class": "RUBY"}, {"name": "MOHAMAD FARIZUAN SHAHRUL BIN HAMDAN", "class": "RUBY"}, {"name": "NUR RABIAATUL ATIKA SYAHIRA BINTI MAZLAN", "class": "RUBY"}, {"name": "SITI NUR ALEYA BINTI MOHD NIZAM", "class": "RUBY"}, {"name": "MUHAMMAD RAHFIQ BIN RAHMAT", "class": "ZIRCON"}, {"name": "YAP ZHI LI", "class": "ZIRCON"}, {"name": "MUHAMMAD RIZMAN QUZAIMI BIN RAMLI", "class": "SAPPHIRE"}, {"name": "RIEFQIEE ADAMI BIN RIZAL", "class": "RUBY"}, {"name": "WONG YU GUAN", "class": "ZIRCON"}, {"name": "PUTRA ARMAND DARIUS BIN RAHMAT", "class": "SAPPHIRE"}, {"name": "CHEON ZI XUAN", "class": "ZIRCON"}, {"name": "CHANG JIA QI", "class": "SAPPHIRE"}, {"name": "MUHAMMAD DANISH RIFQI BIN MOHD NAZLI", "class": "SAPPHIRE"}, {"name": "MUHAMMAD HAZEEQ INDRA BIN AZALI", "class": "ZIRCON"}, {"name": "FATIN NASUHA BINTI ZAHARI", "class": "RUBY"}, {"name": "MUHAMMAD ALIF DANIEL BIN MUJAHID", "class": "ZIRCON"}, {"name": "CHONG CHEE CHEN", "class": "SAPPHIRE"}, {"name": "CHIN JI HAO", "class": "ZIRCON"}, {"name": "CHONG JING SHENG", "class": "ZIRCON"}, {"name": "CHONG LIH MIN", "class": "ZIRCON"}, {"name": "CHONG LIH SEEN", "class": "ZIRCON"}];const questions=[{"id": "q1", "max": 5, "title": "Soalan 1 • Asas Nombor", "body": "\n<b>3 (a)</b> Diberi bahawa 110<sub>10</sub> = n<sub>6</sub>. Cari nilai n.<br>\n<em>It is given that 110<sub>10</sub> = n<sub>6</sub>. Find the value of n.</em> <span class=\"marks\">[2 markah / marks]</span>\n<div class=\"answer-row\"><div class=\"grow\"><label>Jawapan / Answer</label><input id=\"q1a_val\" inputmode=\"numeric\"></div><div class=\"base\"><label>Asas</label><input id=\"q1a_base\" inputmode=\"numeric\" maxlength=\"2\"></div></div>\n<div class=\"sub\"><b>(b)</b> Rajah 2 menunjukkan resit bayaran tiket yang diterima oleh Nawwal ketika bercuti di Legoland.<br>\n<em>Diagram 2 shows the payment receipt received by Nawwal while on holiday in Legoland.</em></div>\n<div class=\"receipt\"><div>LEGOLAND® WATERPARK <b>RM110.00</b></div><div>LEGOLAND® THEMEPARK <b>RM136.00</b></div><div>SEA LIFE MALAYSIA <b>RM60.00</b></div><div><b>JUMLAH KESELURUHAN</b> <b>RM306.00</b></div></div>\n<div class=\"caption\">Rajah 2 / Diagram 2</div>\nNawwal mempunyai wang tunai sebanyak RM1205<sub>7</sub> dan jumlah bayaran yang dikenakan kepadanya adalah berjumlah RM306. Hitung baki wang tunai Nawwal dalam asas lima.<br>\n<em>Nawwal has cash of RM1205<sub>7</sub> and the total payment due to her is RM306. Calculate Nawwal's cash balance in base five.</em> <span class=\"marks\">[3 markah / marks]</span>\n<div class=\"answer-row\"><div class=\"grow\"><label>Jawapan / Answer</label><input id=\"q1b_val\" inputmode=\"numeric\"></div><div class=\"base\"><label>Asas</label><input id=\"q1b_base\" inputmode=\"numeric\" maxlength=\"2\"></div></div>\n", "sol": ["3(a) 110 ÷ 6 = 18 baki 2; 18 ÷ 6 = 3 baki 0; 3 ÷ 6 = 0 baki 3. Jadi 110₁₀ = 302₆.", "3(b) 1205₇ = 1(7³)+2(7²)+0(7)+5 = 446₁₀.", "446 − 306 = 140₁₀.", "140₁₀ = 1030₅."]}, {"id": "q2", "max": 3, "title": "Soalan 2 • Asas Nombor", "body": "\n<b>4</b> Rajah 4 menunjukkan dua keping kad tugasan bagi satu aktiviti STEM. Sekumpulan murid dikehendaki memilih kad yang mempunyai nilai yang lebih besar sebelum bergerak ke stesen seterusnya.<br>\n<em>Diagram 4 shows two task cards used in a STEM activity. A group of students is required to choose a card with higher value before moving to the next station.</em>\n<div class=\"cards\"><div class=\"numcard\">11011<sub>2</sub><b>Kad A</b><small>Card A</small></div><div class=\"numcard\">35<sub>7</sub><b>Kad B</b><small>Card B</small></div></div>\n<div class=\"caption\">Rajah 4 / Diagram 4</div>\nTentukan kad yang mempunyai nilai yang lebih besar.<br><em>Determine the card with higher value.</em> <span class=\"marks\">[3 markah / marks]</span>\n<label>Jawapan / Answer</label><select id=\"q2_ans\"><option value=\"\">-- Pilih --</option><option value=\"A\">Kad A</option><option value=\"B\">Kad B</option></select>\n", "sol": ["11011₂ = 27₁₀.", "35₇ = 26₁₀.", "27 > 26, maka Kad A mempunyai nilai yang lebih besar."]}, {"id": "q3", "max": 4, "title": "Soalan 3 • Rangkaian dalam Teori Graf", "body": "\n<b>7</b> Rajah 3 menunjukkan satu graf yang menghubungkan lima titik A, B, C, D dan E.<br><em>Diagram 3 shows a graph that connects five points A, B, C, D and E.</em>\n<div class=\"graph\"><svg viewBox=\"0 0 560 270\"><g stroke=\"#111\" stroke-width=\"4\" fill=\"none\"><line x1=\"85\" y1=\"70\" x2=\"470\" y2=\"70\"/><line x1=\"85\" y1=\"70\" x2=\"180\" y2=\"205\"/><line x1=\"180\" y1=\"205\" x2=\"390\" y2=\"205\"/><line x1=\"390\" y1=\"205\" x2=\"470\" y2=\"70\"/><line x1=\"285\" y1=\"30\" x2=\"470\" y2=\"70\"/><line x1=\"285\" y1=\"30\" x2=\"390\" y2=\"205\"/></g><g fill=\"#0f4c81\"><circle cx=\"285\" cy=\"30\" r=\"7\"/><circle cx=\"470\" cy=\"70\" r=\"7\"/><circle cx=\"390\" cy=\"205\" r=\"7\"/><circle cx=\"180\" cy=\"205\" r=\"7\"/><circle cx=\"85\" cy=\"70\" r=\"7\"/></g><g font-size=\"22\" font-weight=\"700\"><text x=\"276\" y=\"22\">A</text><text x=\"482\" y=\"76\">B</text><text x=\"397\" y=\"232\">C</text><text x=\"160\" y=\"232\">D</text><text x=\"56\" y=\"76\">E</text></g></svg></div>\n<div class=\"caption\">Rajah 3 / Diagram 3</div>\nBerdasarkan graf tersebut, nyatakan<br><em>Based on the graph, state</em>\n<div class=\"grid\"><div><label>(a) bilangan bucu, n(V).</label><input id=\"q3a\" inputmode=\"numeric\"></div><div><label>(b) bilangan tepi, n(E).</label><input id=\"q3b\" inputmode=\"numeric\"></div><div><label>(c) darjah bagi bucu, B.</label><input id=\"q3c\" inputmode=\"numeric\"></div><div><label>(d) satu bucu yang mempunyai darjah 2.</label><input id=\"q3d\"></div></div>\n<span class=\"marks\">[4 markah / marks]</span>\n", "sol": ["(a) n(V)=5.", "(b) Tepi: EB, ED, DC, CB, AB dan AC, jadi n(E)=6.", "(c) Darjah B=3.", "(d) Contoh: A. D atau E juga mempunyai darjah 2."]}, {"id": "q4", "max": 4, "title": "Soalan 4 • Sukatan Serakan Data Tak Terkumpul", "body": "\n<b>3</b> Data berikut menunjukkan masa (dalam minit) yang diambil oleh 5 orang pelajar untuk menyiapkan suatu tugasan.<br><em>The following data shows the time (in minutes) taken by 5 students to complete a task.</em>\n<div class=\"data\"><span>15</span><span>18</span><span>20</span><span>15</span><span>22</span></div>\n<div class=\"sub\"><b>(a)</b> Nyatakan median bagi data tersebut.<br><em>State the median of the data.</em> <span class=\"marks\">[1 markah / mark]</span></div><input id=\"q4a\" inputmode=\"decimal\">\n<div class=\"sub\"><b>(b)</b> Hitung min bagi data tersebut.<br><em>Calculate the mean of the data.</em> <span class=\"marks\">[2 markah / marks]</span></div><input id=\"q4b\" inputmode=\"decimal\">\n<div class=\"sub\"><b>(c)</b> Seorang lagi pelajar mengambil masa 10 minit. Tentukan sama ada median baharu berubah atau tidak, dan berikan sebab.<br><em>Another student took 10 minutes. Determine whether the new median changes or not and give a reason.</em> <span class=\"marks\">[1 markah / mark]</span></div>\n<div class=\"grid\"><div><label>Keputusan</label><select id=\"q4c_status\"><option value=\"\">-- Pilih --</option><option value=\"berubah\">Berubah</option><option value=\"tidak\">Tidak berubah</option></select></div><div><label>Median baharu</label><input id=\"q4c_med\" inputmode=\"decimal\"></div></div>\n<label>Sebab / Reason</label><input id=\"q4c_reason\">\n", "sol": ["(a) Susun: 15,15,18,20,22. Median=18.", "(b) Min=(15+18+20+15+22)÷5=18.", "(c) Data baharu: 10,15,15,18,20,22. Median baharu=(15+18)÷2=16.5, jadi median berubah."]}, {"id": "q5", "max": 3, "title": "Soalan 5 • Pengurusan Kewangan", "body": "\n<b>14 (a)</b> Alice bekerja sebagai pereke hiasan dalaman di sebuah syarikat dengan gaji RM8 500. Dia juga menerima RM1 200 setiap bulan hasil sewa rumahnya. Perbelanjaan tetap dan perbelanjaan tidak tetap bulanannya masing-masing RM4 350 dan RM3 610. Jika Alice menetapkan 12% daripada gajinya sebagai simpanan tetap bulanan, hitung aliran tunai bulanannya.<br>\n<em>Alice works as an interior designer in a company with a salary of RM8 500. She also receives RM1 200 every month from house rental income. The monthly fixed expenses and monthly non-fixed expenses are RM4 350 and RM3 610 respectively. If Alice sets 12% of her salary as monthly fixed savings, calculate her monthly cash flow.</em> <span class=\"marks\">[3 markah / marks]</span>\n<label>Jawapan / Answer (RM)</label><input id=\"q5_ans\" inputmode=\"decimal\">\n", "sol": ["Jumlah pendapatan=8500+1200=RM9700.", "Simpanan=12%×8500=RM1020.", "Jumlah perbelanjaan=4350+3610=RM7960.", "Aliran tunai=9700−7960−1020=RM720."]}];const D=1500;let nm="",cl="",start=0,end=0,timer=null,done=false;
const classes=()=>[...new Set(students.map(x=>x.class))].sort();const norm=v=>String(v??"").toLowerCase().replace(/\s+/g,"").replace(/,/g,"").replace(/rm/g,"");
function login(){clearInterval(timer);document.getElementById("app").innerHTML=`<div class="notice"><b>Arahan:</b> Pilih kelas dan nama. Semua bahagian kecil soalan dikekalkan. Masa 25 minit. Jika masa tamat, sistem akan semak dan hantar automatik.</div><div class="login"><div><label>Kelas</label><select id="cl" onchange="names()"><option value="">-- Pilih --</option>${classes().map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Nama</label><select id="nm"><option value="">-- Pilih kelas dahulu --</option></select></div></div><div style="text-align:center;margin-top:13px"><button class="primary" onclick="begin()">Mula Latihan</button></div>`}
function names(){cl=document.getElementById("cl").value;document.getElementById("nm").innerHTML='<option value="">-- Pilih --</option>'+students.filter(x=>x.class===cl).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option>${x.name}</option>`).join("")}
function begin(){cl=document.getElementById("cl").value;nm=document.getElementById("nm").value;if(!cl||!nm)return alert("Pilih kelas dan nama.");done=false;start=Date.now();end=start+D*1000;quiz();tick()}
function quiz(){document.getElementById("app").innerHTML=`<div class="topbar"><b>${nm} • ${cl}</b><span class="timer" id="tm">25:00</span></div><div class="progress"><div id="pg" style="width:0"></div></div>${questions.map(q=>`<div class="qcard" id="c${q.id}"><div class="qhead">${q.title} • ${q.max} markah</div>${q.body}<div class="feedback" id="f${q.id}"></div><div class="solution" id="s${q.id}"><b>Jalan kerja / Working</b><ol>${q.sol.map(z=>`<li>${z}</li>`).join("")}</ol></div></div>`).join("")}<div class="actions"><button class="primary" id="send" onclick="submit(false)">Semak & Hantar</button></div><div id="res"></div>`}
function tick(){clearInterval(timer);timer=setInterval(()=>{if(done)return;let s=Math.max(0,Math.ceil((end-Date.now())/1000)),e=document.getElementById("tm");e.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;e.className="timer"+(s<=60?" danger":s<=300?" warn":"");if(s<=0){clearInterval(timer);submit(true)}},250)}
function s1(){let s=0;if(norm(q1a_val.value)==="302"&&norm(q1a_base.value)==="6")s+=2;if(norm(q1b_val.value)==="1030"&&norm(q1b_base.value)==="5")s+=3;return s}
function s2(){return q2_ans.value==="A"?3:0}
function s3(){let s=0;if(norm(q3a.value)==="5")s++;if(norm(q3b.value)==="6")s++;if(norm(q3c.value)==="3")s++;if(["a","d","e"].includes(norm(q3d.value)))s++;return s}
function s4(){let s=0;if(norm(q4a.value)==="18")s++;if(norm(q4b.value)==="18")s+=2;if(q4c_status.value==="berubah"&&["16.5","165"].includes(norm(q4c_med.value))&&String(q4c_reason.value).trim())s++;return s}
function s5(){return norm(q5_ans.value)==="720"?3:0}
async function submit(auto){if(done)return;done=true;clearInterval(timer);const scores={q1:s1(),q2:s2(),q3:s3(),q4:s4(),q5:s5()};let score=0;questions.forEach(q=>{score+=scores[q.id];document.getElementById("s"+q.id).style.display="block";document.getElementById("c"+q.id).classList.add(scores[q.id]===q.max?"correct":"wrong");document.getElementById("f"+q.id).textContent=`Markah: ${scores[q.id]}/${q.max}`});document.querySelectorAll("input,select").forEach(x=>x.disabled=true);const total=16,pct=Math.round(score/total*100),dur=Math.min(D,Math.round((Date.now()-start)/1000));const rec={name:nm,class:cl,set:"KERTAS 2 ARAS RENDAH",score,total,pct,duration_seconds:dur,timed_out:auto};if(WEB_APP_URL&&!WEB_APP_URL.includes("PASTE"))try{await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)})}catch(e){}document.getElementById("send").disabled=true;document.getElementById("res").innerHTML=`<div class="result"><b>${auto?"Masa tamat — dihantar automatik.":"Semakan selesai."}</b><div class="big">${score}/${total}</div><div>${pct}%</div><p>Jalan kerja dipaparkan di bawah setiap soalan.</p><button class="secondary" onclick="login()">Kembali</button></div>`;document.getElementById("res").scrollIntoView({behavior:"smooth"})}
login();
</script></body></html>
