<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top 20 Kertas 2 Aras Rendah</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#1f2937;
}
.card{
  width:min(820px,97vw);
  margin:8px auto;
  background:#fffaf0;
  border:1px solid #ead9b8;
  border-left:7px solid #d99a1d;
  border-radius:16px;
  box-shadow:0 8px 24px rgba(60,45,20,.12);
  padding:18px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.title{
  font-size:21px;
  font-weight:900;
}
.scope{
  font-size:12px;
  color:#7b6c4f;
}
.status{
  font-size:12px;
  color:#8a7449;
  margin:7px 0 10px;
}
.error{
  display:none;
  background:#fff1f0;
  color:#b42318;
  border:1px solid #f2b8b5;
  border-radius:9px;
  padding:10px 12px;
  margin:8px 0 10px;
  font-size:12px;
  line-height:1.45;
}
.tablewrap{
  max-height:700px;
  overflow:auto;
  border-radius:10px;
}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
th{
  position:sticky;
  top:0;
  z-index:2;
  background:#fffaf0;
  font-size:11px;
  color:#8a7449;
  padding:8px 6px;
  text-align:left;
  border-bottom:1px dashed #ddcfb4;
}
td{
  padding:9px 6px;
  border-bottom:1px dashed #e3d9c4;
  font-size:13px;
  vertical-align:middle;
}
.rank{width:50px;font-weight:900}
.name{font-weight:800}
.kelas{width:105px}
.markah{width:90px;text-align:right;font-weight:900}
.masa{width:90px;text-align:right}
.empty{
  text-align:center;
  padding:26px;
  color:#8c7b5d;
}
.footer{
  margin-top:10px;
  text-align:right;
  font-size:10px;
  color:#8c7b5d;
}
@media(max-width:600px){
  .card{padding:13px 10px}
  .title{font-size:17px}
  th,td{font-size:11px;padding:7px 4px}
  .rank{width:38px}
  .kelas{width:76px}
  .markah{width:64px}
  .masa{display:none}
  .tablewrap{max-height:620px}
}
</style>
</head>
<body>

<div class="card">
  <div class="top">
    <div class="title">🏆 Top 20 • Kertas 2 Aras Rendah</div>
    <div class="scope">Semua kelas</div>
  </div>

  <div id="status" class="status">Memuatkan ranking...</div>
  <div id="errorBox" class="error"></div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th class="rank">Rank</th>
          <th>Nama</th>
          <th class="kelas">Kelas</th>
          <th class="markah">Markah</th>
          <th class="masa">Masa</th>
        </tr>
      </thead>
      <tbody id="rankingBody">
        <tr><td colspan="5" class="empty">Memuatkan data...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer">
    Ranking: peratus tertinggi → markah tertinggi → masa terpantas
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx2vhCXFen3iif1OMYi3Hx9jj0yoB8iimjM9GTp2na4J6GtV5bRbwxsVlutJaxRbi_b1Q/exec";

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function medal(i){
  return i===0 ? "🥇" :
         i===1 ? "🥈" :
         i===2 ? "🥉" :
         String(i+1);
}

function formatTime(sec){
  sec = Number(sec || 0);
  if(!Number.isFinite(sec) || sec <= 0) return "-";
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `${m}m ${String(s).padStart(2,"0")}s`;
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const callbackName =
      "mathgicRanking_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*100000);

    const script = document.createElement("script");

    const timeout = setTimeout(()=>{
      cleanup();
      reject(new Error("Masa menunggu data tamat. Semak deployment Apps Script."));
    },15000);

    function cleanup(){
      clearTimeout(timeout);
      try{ delete window[callbackName]; }catch(e){}
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data){
      cleanup();
      resolve(data);
    };

    script.onerror = function(){
      cleanup();
      reject(new Error("Sambungan ke Apps Script gagal."));
    };

    const sep = url.includes("?") ? "&" : "?";

    script.src =
      url +
      sep +
      "mode=top20" +
      "&callback=" + encodeURIComponent(callbackName) +
      "&t=" + Date.now();

    document.body.appendChild(script);
  });
}

function normalizeRows(data){
  if(Array.isArray(data)) return data;

  // Sokong jika Apps Script memulangkan {data:[...]}
  if(data && Array.isArray(data.data)) return data.data;

  if(data && data.status === "error"){
    throw new Error(data.message || "Apps Script memulangkan ralat.");
  }

  throw new Error("Format data ranking tidak sah.");
}

async function loadRanking(){
  const body = document.getElementById("rankingBody");
  const status = document.getElementById("status");
  const err = document.getElementById("errorBox");

  err.style.display = "none";
  err.textContent = "";
  status.textContent = "Mengemas kini ranking...";

  try{
    let rows = normalizeRows(await jsonp(WEB_APP_URL));

    // Keselamatan tambahan:
    // Jika doGet Apps Script belum memproses top20,
    // HTML akan pilih rekod terbaik setiap murid di sini juga.
    const best = {};

    rows.forEach(r=>{
      const name = String(r.name ?? r.Nama ?? "").trim();
      const kelas = String(r.class ?? r.kelas ?? r.Kelas ?? "").trim();

      let score = Number(r.score ?? r.Markah ?? 0);
      let total = Number(r.total ?? r.Jumlah ?? 0);
      let pct = Number(r.pct ?? r.Peratus);

      if(!Number.isFinite(pct)){
        pct = total > 0 ? (score / total * 100) : 0;
      }

      const duration = Number(
        r.duration_seconds ??
        r.duration ??
        r["Masa Saat"] ??
        0
      );

      if(!name || !kelas) return;

      const key =
        name.toUpperCase() +
        "||" +
        kelas.toUpperCase();

      const item = {
        name,
        class: kelas,
        score,
        total,
        pct,
        duration_seconds: duration
      };

      const old = best[key];

      if(
        !old ||
        pct > old.pct ||
        (pct === old.pct && score > old.score) ||
        (
          pct === old.pct &&
          score === old.score &&
          duration > 0 &&
          (old.duration_seconds <= 0 || duration < old.duration_seconds)
        )
      ){
        best[key] = item;
      }
    });

    rows = Object.values(best)
      .sort((a,b)=>
        b.pct - a.pct ||
        b.score - a.score ||
        (
          (a.duration_seconds || 999999) -
          (b.duration_seconds || 999999)
        ) ||
        a.name.localeCompare(b.name)
      )
      .slice(0,20);

    if(!rows.length){
      body.innerHTML =
        '<tr><td colspan="5" class="empty">Belum ada rekod markah untuk dipaparkan.</td></tr>';

      status.textContent =
        "Tiada rekod ditemui.";

      return;
    }

    body.innerHTML = rows.map((r,i)=>`
      <tr>
        <td class="rank">${medal(i)}</td>
        <td class="name">${esc(r.name)}</td>
        <td class="kelas">${esc(r.class)}</td>
        <td class="markah">${Number(r.pct).toFixed(0)}%</td>
        <td class="masa">${formatTime(r.duration_seconds)}</td>
      </tr>
    `).join("");

    status.textContent =
      "Dikemas kini: " +
      new Date().toLocaleTimeString("ms-MY");

  }catch(e){
    body.innerHTML =
      '<tr><td colspan="5" class="empty">Ranking belum dapat dipaparkan.</td></tr>';

    err.style.display = "block";
    err.textContent =
      e.message +
      " Pastikan Apps Script telah Deploy sebagai Web App dan akses ditetapkan kepada Anyone.";

    status.textContent =
      "Gagal memuatkan ranking.";
  }
}

loadRanking();
setInterval(loadRanking,15000);
</script>

</body>
</html>
