<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Algebra Tetris</title><style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}.wrap{max-width:900px;margin:auto;padding:10px}.hero,.panel{background:#1f2937;border:1px solid #334155;border-radius:14px;padding:14px;margin:10px 0}.hero{background:#172554}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{padding:10px;border:none;border-radius:10px;font-weight:900}.active{background:#2563eb;color:#fff}.tab{background:#334155;color:#fff}select{width:100%;padding:10px;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:8px}.row{display:grid;grid-template-columns:45px 1fr 90px 80px;gap:8px;padding:10px 3px;border-bottom:1px solid #334155}.num{width:34px;height:34px;border-radius:50%;background:#f59e0b;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900}.nm{font-weight:900}.cl{font-size:.75rem;color:#cbd5e1}.wa{width:100%;background:#25D366;color:#fff;margin-top:8px}</style></head><body><div class="wrap"><div class="hero"><h1>🏆 Ranking Algebra Tetris</h1></div><div class="panel"><div class="tabs"><button id="to" class="active" onclick="view('o')">By Tingkatan</button><button id="tc" class="tab" onclick="view('c')">By Class</button></div><button class="wa" onclick="share()">📲 Kongsi ke WhatsApp</button><div id="overall"></div><div id="cv" style="display:none"><select id="cf" onchange="renderClass()"></select><div id="cr"></div></div></div></div><script>
const U="https://script.google.com/macros/s/AKfycbyGrp9QEtqecdMCPHGNCwuhdAXiLK_MXG51qwUrOmQa1RBRp2D-9-bgJPqDIUAqL6JI/exec";let O=[],C={},A='o';const $=id=>document.getElementById(id);
function view(v){A=v;$('overall').style.display=v==='o'?'block':'none';$('cv').style.display=v==='c'?'block':'none';$('to').className=v==='o'?'active':'tab';$('tc').className=v==='c'?'active':'tab'}
function rows(a){return (!a||!a.length)?'<p>Belum ada rekod.</p>':a.map(r=>`<div class="row"><div class="num">${r.rank}</div><div><div class="nm">${r.nama}</div><div class="cl">${r.kelas}</div></div><div>${r.skor} pts</div><div>${r.betul} betul</div></div>`).join('')}
function renderClass(){$('cr').innerHTML=rows(C[$('cf').value]||[])}
function pop(){let s=$('cf');s.innerHTML='';Object.keys(C).sort().forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o)});renderClass()}
function jp(a){return new Promise((r,j)=>{let cb='cb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script');window[cb]=d=>{r(d);s.remove();delete window[cb]};s.onerror=()=>j();s.src=U+'?action='+a+'&callback='+cb;document.body.appendChild(s)})}
async function load(){let[a,b]=await Promise.all([jp('gameranking50'),jp('gamebyclass')]);O=a.top50||[];C=b.byClass||{};$('overall').innerHTML=rows(O);pop()}
function share(){let a=A==='o'?O:(C[$('cf').value]||[]),t=['🎮 *RANKING ALGEBRA TETRIS*',''];a.forEach(r=>t.push(`${r.rank}. ${r.nama} (${r.kelas}) — ${r.skor} pts`));window.open('https://wa.me/?text='+encodeURIComponent(t.join('\n')),'_blank')}
load();setInterval(load,60000);
</script></body></html>
