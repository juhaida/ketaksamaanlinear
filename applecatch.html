function updateScoreTimer(){

function spawnApple(){

  const area=document.getElementById("gameArea");
  if(!area)return;

  const id=++appleId;
  const value=challenge.pool[Math.floor(Math.random()*challenge.pool.length)];
  const apple=document.createElement("div");
  apple.className="apple";
  apple.textContent=value;
  apple.dataset.id=id;
  apple.dataset.value=value;

  const maxX=Math.max(20, area.clientWidth-70);
  const startX=20+Math.random()*(maxX-20);
  apple.style.left=startX+"px";
  apple.style.top="-60px";
  area.appendChild(apple);

  const speed=1.6+Math.random()*1.7;
  apples.set(id,{el:apple,y:-60,speed,value});
  animateApple(id);
}

  if(!item||!playing)return;
  const area=document.getElementById("gameArea");
  const basket=document.getElementById("basket");
  if(!area||!basket)return;

  item.y+=item.speed;
  item.el.style.top=item.y+"px";

  // Collision with basket
  const ar=area.getBoundingClientRect();
  const appleRect=item.el.getBoundingClientRect();
  const basketRect=basket.getBoundingClientRect();

  const hit =
    appleRect.bottom >= basketRect.top &&
    appleRect.top <= basketRect.bottom &&
    appleRect.right >= basketRect.left &&
    appleRect.left <= basketRect.right;

  if(hit){
    const correct=challenge.values.includes(Number(item.value));
    score += correct ? 1 : -1;
    showPop(item.el, correct ? "+1" : "−1", correct);
    item.el.remove();
    apples.delete(id);
    updateScoreTimer();
    return;
  }

  if(item.y>area.clientHeight+10){
    item.el.remove();
    apples.delete(id);
    return;
  }

  requestAnimationFrame(()=>animateApple(id));
}

function setupBasketControls(){
  const area=document.getElementById("gameArea");
  const basket=document.getElementById("basket");
  if(!area||!basket)return;

  basketX=(area.clientWidth-basketWidth)/2;
  updateBasket();

  const leftBtn=document.getElementById("leftBtn");
  const rightBtn=document.getElementById("rightBtn");

  const startLeft=(e)=>{e.preventDefault();moveLeft=true;};
  const stopLeft=(e)=>{if(e)e.preventDefault();moveLeft=false;};
  const startRight=(e)=>{e.preventDefault();moveRight=true;};
  const stopRight=(e)=>{if(e)e.preventDefault();moveRight=false;};

  ["pointerdown","touchstart"].forEach(ev=>leftBtn.addEventListener(ev,startLeft,{passive:false}));
  ["pointerup","pointerleave","pointercancel","touchend"].forEach(ev=>leftBtn.addEventListener(ev,stopLeft,{passive:false}));

  ["pointerdown","touchstart"].forEach(ev=>rightBtn.addEventListener(ev,startRight,{passive:false}));
  ["pointerup","pointerleave","pointercancel","touchend"].forEach(ev=>rightBtn.addEventListener(ev,stopRight,{passive:false}));

  document.addEventListener("keydown",basketKeyDown);
  document.addEventListener("keyup",basketKeyUp);

  // Also allow dragging / moving pointer inside game area
  let dragging=false;
  area.addEventListener("pointerdown",(e)=>{
    if(e.target.classList.contains("apple"))return;
    dragging=true;
    moveBasketToPointer(e);
  });
  area.addEventListener("pointermove",(e)=>{
    if(dragging)moveBasketToPointer(e);
  });
  area.addEventListener("pointerup",()=>dragging=false);
  area.addEventListener("pointerleave",()=>dragging=false);

  basketLoop();
}

function basketKeyDown(e){
  if(!playing)return;
  if(e.key==="ArrowLeft"){e.preventDefault();moveLeft=true;}
  if(e.key==="ArrowRight"){e.preventDefault();moveRight=true;}
}
function basketKeyUp(e){
  if(e.key==="ArrowLeft")moveLeft=false;
  if(e.key==="ArrowRight")moveRight=false;
}
function moveBasketToPointer(e){
  const area=document.getElementById("gameArea");
  if(!area)return;
  const rect=area.getBoundingClientRect();
  basketX=(e.clientX-rect.left)-basketWidth/2;
  clampBasket();
  updateBasket();
}
function clampBasket(){
  const area=document.getElementById("gameArea");
  if(!area)return;
  basketX=Math.max(0,Math.min(area.clientWidth-basketWidth,basketX));
}
function updateBasket(){
  const basket=document.getElementById("basket");
  if(!basket)return;
  basket.style.left=basketX+"px";
  basket.style.transform="none";
}
function basketLoop(){
  if(!playing)return;
  const speed=7;
  if(moveLeft)basketX-=speed;
  if(moveRight)basketX+=speed;
  clampBasket();
  updateBasket();
  basketAnim=requestAnimationFrame(basketLoop);
}

function showPop(el,text,good){
  const area=document.getElementById("gameArea");
  if(!area)return;
  const p=document.createElement("div");
  p.className="pop";
  p.textContent=text;
  p.style.left=(el.offsetLeft+15)+"px";
  p.style.top=(el.offsetTop)+"px";
  p.style.color=good?"#166534":"#b91c1c";
  area.appendChild(p);
  setTimeout(()=>p.remove(),700);
}

async function endGame(){
  playing=false;
  clearInterval(spawnTimer); clearInterval(clockTimer); clearInterval(refreshTimer);
  if(basketAnim) cancelAnimationFrame(basketAnim);
  document.removeEventListener('keydown',basketKeyDown);
  document.removeEventListener('keyup',basketKeyUp);
  apples.forEach(x=>x.el.remove()); apples.clear();

  const payload={
    type:"game_score",
    name:selectedStudent,class:selectedClass,
    score:score,challenge:challenge.name,
    topic:"Explore Set - MATHGIC Apple Catch"
  };

  if(WEB_APP_URL && !WEB_APP_URL.startsWith("PASTE_")){
    try{await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});}catch(e){}
  }

  document.getElementById("app").innerHTML=`
    <div class="final">
      <span class="badge">1 MINIT SELESAI</span>
      <h1>MATHGIC Apple Catch Tamat</h1>
      <p>${selectedStudent} • ${selectedClass}</p>
      <div class="bigscore">${score}</div>
      <p class="sub">Set sasaran: ${challenge.name}</p>
      <button class="primary" onclick="renderLogin()">Kembali</button>
    </div>`;
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"));},8000);
    function cleanup(){clearTimeout(timer);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=(data)=>{cleanup();resolve(data);};
    s.onerror=()=>{cleanup();reject(new Error("network"));};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
    document.body.appendChild(s);
  });
}

async function loadLeaderboard(){
  const box=document.getElementById("leaderBox");
  if(!box || !WEB_APP_URL || WEB_APP_URL.startsWith("PASTE_"))return;
  try{
    const data=await jsonp(WEB_APP_URL+"?action=game_leaderboard");
    const rows=Array.isArray(data.leaderboard)?data.leaderboard:[];
    box.innerHTML=rows.length?`<table><tbody>${rows.map(r=>`<tr><td>${r.rank}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.class)}</td><td class="pts">${r.score}</td></tr>`).join("")}</tbody></table>`:"Belum ada markah.";
  }catch(e){box.textContent="Ranking belum tersedia.";}
}

async function loadChat(){
  const box=document.getElementById("chatBox");
  if(!box || !WEB_APP_URL || WEB_APP_URL.startsWith("PASTE_"))return;
  try{
    const data=await jsonp(WEB_APP_URL+"?action=chat_read");
    const rows=Array.isArray(data.messages)?data.messages:[];
    box.innerHTML=rows.map(m=>`<div class="msg"><div class="meta">${escapeHtml(m.name)} • ${escapeHtml(m.class)} • ${escapeHtml(m.time)}</div><div class="text">${escapeHtml(m.message)}</div></div>`).join("");
    box.scrollTop=box.scrollHeight;
  }catch(e){}
}

async function sendChat(){
  const input=document.getElementById("chatInput");
  const status=document.getElementById("chatStatus");
  if(!input)return;
  const message=input.value.trim();
  if(!message)return;
  if(message.length>80)return;
  status.textContent="Menghantar...";
  const payload={type:"chat_message",name:selectedStudent,class:selectedClass,message:message};
  try{
    await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});
    input.value=""; status.textContent="Dihantar.";
    setTimeout(loadChat,800);
  }catch(e){status.textContent="Mesej tidak dapat dihantar.";}
}
function quickChat(m){const i=document.getElementById("chatInput");if(i){i.value=m;sendChat();}}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}

renderLogin();
</script>
