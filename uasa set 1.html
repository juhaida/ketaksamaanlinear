<title>UASA Matematik Tingkatan 1 - Revision Paper 2023</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#16202a;--muted:#5f6b76;--primary:#145da0;--good:#18794e;--bad:#c62828;}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:14px} .hero{background:linear-gradient(135deg,#145da0,#0c3d68);color:#fff;padding:20px;border-radius:18px;margin-bottom:14px}
.hero h1{font-size:1.35rem;margin:0 0 6px} .hero p{margin:3px 0;opacity:.95}
.panel,.card{background:var(--card);border:1px solid #dfe7ef;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 7px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} label.title{font-weight:700;font-size:.9rem;display:block;margin-bottom:5px}
select,button{width:100%;padding:12px;border-radius:11px;border:1px solid #cbd5df;font-size:1rem;background:#fff}
button{border:none;background:var(--primary);color:white;font-weight:800;cursor:pointer} button.secondary{background:#5f6b76} button.danger{background:#b3261e}
button:disabled{opacity:.55;cursor:not-allowed}
.qtitle{font-weight:800;font-size:1rem;line-height:1.5} .en{color:var(--muted);font-style:italic;font-size:.91rem;margin:5px 0 10px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid #dce5ed;border-radius:11px;padding:10px;margin:7px 0;cursor:pointer}
.opt:hover{background:#f7fbff} .opt input{margin-top:3px;transform:scale(1.15)}
.diagram-wrap{display:flex;justify-content:center;margin:10px 0 8px} .diagram{display:block;width:auto;max-width:100%;height:auto;max-height:270px;border:1px solid #dfe7ef;border-radius:10px;background:#fff;padding:5px;object-fit:contain}
.diagram.tall{max-height:320px;max-width:330px} .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1;margin:0 .12em}
.frac .top{border-bottom:1.5px solid currentColor;padding:0 .15em .08em} .frac .bottom{padding:.08em .15em 0} .math{white-space:nowrap}
.result{font-size:1.25rem;font-weight:900;text-align:center;padding:18px;border-radius:14px;background:#eef7ff}
.small{font-size:.88rem;color:var(--muted)} table{width:100%;border-collapse:collapse;font-size:.9rem} th,td{padding:9px;border-bottom:1px solid #e2e8ef;text-align:left} th{background:#eef4f8}
.review-good{border-left:5px solid var(--good)} .review-bad{border-left:5px solid var(--bad)}
.formula-box{margin:10px 0 12px;border:1px solid #b9d7ee;background:#f3f9fd;border-radius:11px;padding:10px 12px}
.formula-box summary{cursor:pointer;font-weight:800;color:#0c4f82}
.formula-content{margin-top:8px;line-height:1.55;font-size:.94rem}
.formula-content .note{color:#5f6b76;font-size:.88rem;margin-top:5px}
@media(max-width:620px){.grid{grid-template-columns:1fr} .wrap{padding:9px} .card{padding:13px} .hero{padding:16px} .diagram{max-height:220px} .diagram.tall{max-height:280px;max-width:280px}}
</style>
</head>

     Bilangan bakul = jumlah oren ÷ kapasiti sebuah bakul.`,
  8:`<b>Hukum indeks & algebra</b><br>
     a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup><br>
     a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup><br>
     Darab pekali dengan pekali, kemudian gabungkan pemboleh ubah yang sama.`,
  9:`<b>Membina persamaan linear</b><br>
     Jika Ammar mempunyai p pensel, Aqil mempunyai <b>p − 3</b> pensel.<br>
     Jumlah kedua-duanya = 11.`,
  10:`<b>Persamaan linear serentak</b><br>
      Gantikan nilai x dan y bagi setiap pilihan ke dalam <b>kedua-dua persamaan</b>.<br>
      Pilihan yang betul mesti memuaskan kedua-duanya.`,
  11:`<b>Garis nombor & ketaksamaan</b><br>
      Bulatan penuh bermaksud nilai itu <b>termasuk</b> (≤ atau ≥).<br>
      Anak panah ke kiri bermaksud nilai lebih kecil; ke kanan bermaksud lebih besar.`,
  12:`<b>Jumlah sudut pada garis / sudut berkaitan</b><br>
      Sudut penggenap (complementary) berjumlah <b>90°</b>.<br>
      Sudut pada garis lurus berjumlah <b>180°</b>.`,
  13:`<b>Segi tiga sama kaki</b><br>
      Dua sudut tapak adalah sama.<br>
      Jumlah sudut dalam segi tiga = <b>180°</b>.`,
  14:`<b>Bilangan pepenjuru poligon</b><br>
      Bilangan pepenjuru = <span class="frac"><span class="top">n(n−3)</span><span class="bottom">2</span></span><br>
      n = bilangan sisi.`,
  15:`<b>Segi empat sama</b><br>
      Luas = sisi², jadi sisi = √(luas).<br>
      Perimeter segi empat sama besar = 4 × sisi segi empat sama besar.`,
  16:`<b>Pelengkap set</b><br>
      R′ = semua unsur dalam set semesta ξ yang <b>bukan</b> berada dalam set R.`,
  17:`<b>Mengira bilangan unsur set</b><br>
      Senaraikan semua gandaan 3 yang memenuhi julat diberi, kemudian kira bilangannya.`,
  18:`<b>Beza jumlah markah</b><br>
      Jumlah BM = tambah semua markah BM.<br>
      Jumlah BI = tambah semua markah BI.<br>
      Beza = |Jumlah BM − Jumlah BI|.`,
  19:`<b>Carta pai</b><br>
      Jumlah sudut satu bulatan = <b>360°</b>.<br>
      Bilangan murid = <span class="frac"><span class="top">sudut sektor</span><span class="bottom">360°</span></span> × jumlah murid.`,
  20:`<b>Teorem Pythagoras</b><br>
      c² = a² + b²<br>
      Untuk segi tiga sama kaki, tinggi membahagikan tapak kepada dua bahagian sama panjang.<br>
      <span class="note">c ialah sisi paling panjang / hipotenus.</span>`
};

let startTime=Date.now();

const $=id=>document.getElementById(id);
function secText(s){s=Math.max(0,Math.round(s||0));return `${Math.floor(s/60)}m ${s%60}s`;}
function init(){
  Object.keys(STUDENTS).forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('kelas').appendChild(o);});
  $('kelas').addEventListener('change',()=>{
    let c=$('kelas').value,n=$('nama');n.innerHTML='<option value="">-- Pilih nama --</option>';
    if(c) STUDENTS[c].forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;n.appendChild(o);});
    n.disabled=!c;
  });
  renderQuiz();
}
function renderQuiz(){
  $('quiz').innerHTML=QUESTIONS.map((q,i)=>{
    let img=q.img?`<div class="diagram-wrap"><img class="diagram ${q.img==='q18'?'tall':''}" src="${IMAGES[q.img]}" alt="Rajah soalan ${i+1}"></div>`:'';
    let opts=q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span><b>${String.fromCharCode(65+j)}.</b> ${o}</span></label>`).join('');
    let guide=FORMULA_GUIDES[i+1]?`<details class="formula-box"><summary>📘 Panduan Formula</summary><div class="formula-content">${FORMULA_GUIDES[i+1]}</div></details>`:'';
    return `<section class="card" id="card${i}"><div class="qtitle">${i+1}. ${q.q}</div>${q.en?`<div class="en">${q.en}</div>`:''}${img}${guide}${opts}</section>`;
  }).join('');
}
function getRecords(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){return []}}
function saveRecords(r){localStorage.setItem(STORE_KEY,JSON.stringify(r));}
async function submitQuiz(){
  const kelas=$('kelas').value,nama=$('nama').value;
  if(!kelas||!nama){alert('Sila pilih kelas dan nama pelajar dahulu.');return;}

  let unanswered=[],score=0;
  QUESTIONS.forEach((q,i)=>{
    let checked=document.querySelector(`input[name="q${i}"]:checked`);
    if(!checked) unanswered.push(i+1);
    else if(+checked.value===q.a) score++;
  });

  if(unanswered.length){
    alert('Sila jawab semua soalan. Belum dijawab: '+unanswered.join(', '));
    return;
  }

  const seconds=Math.max(1,Math.round((Date.now()-startTime)/1000));

  // Simpan salinan pada peranti
  let records=getRecords();
  const attempts=records.filter(r=>r.set===SET_NAME&&r.class===kelas&&r.name===nama).length+1;
  records.push({
    set:SET_NAME,
    ts:new Date().toISOString(),
    class:kelas,
    name:nama,
    score,
    total:20,
    percent:score*5,
    seconds,
    attempt:attempts
  });
  saveRecords(records);

  showResult(score,seconds);
  renderReview();

  const status=$('saveStatus');
  status.style.display='block';
  status.style.color='#5f6b76';
  status.textContent='Sedang menyimpan markah ke Google Sheet...';

  try{
    const payload={
      action:'submit',
      set:SET_NAME,
      kelas:kelas,
      nama:nama,
      markah:score,
      jumlah:20,
      masaSaat:seconds
    };

    const res=await fetch(SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });

    const data=await res.json();
    if(!data.ok) throw new Error(data.message||'Gagal menyimpan markah.');

    status.style.color='#18794e';
    status.textContent='✓ Markah berjaya disimpan ke Google Sheet.';
  }catch(err){
    status.style.color='#c62828';
    status.textContent='Markah pada peranti sudah disimpan, tetapi penghantaran ke Google Sheet gagal. '+err.message;
  }

  window.scrollTo({top:$('resultBox').offsetTop-80,behavior:'smooth'});
}
function showResult(score,seconds){
  let box=$('resultBox');box.style.display='block';box.innerHTML=`<div class="result">Markah: ${score} / 20 (${score*5}%)<br><span style="font-size:.9rem;font-weight:600">Masa: ${secText(seconds)}</span></div>`;
}
function renderReview(){
  QUESTIONS.forEach((q,i)=>{
    let card=$('card'+i),checked=document.querySelector(`input[name="q${i}"]:checked`),v=+checked.value;
    card.classList.remove('review-good','review-bad');card.classList.add(v===q.a?'review-good':'review-bad');
    card.querySelectorAll('.opt').forEach((el,j)=>{
      el.style.background=j===q.a?'#eaf7ef':(j===v&&v!==q.a?'#fdecec':'');
    });
  });
}
function retryQuiz(){
  document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);
  document.querySelectorAll('.card').forEach(c=>{c.classList.remove('review-good','review-bad');c.querySelectorAll('.opt').forEach(o=>o.style.background='');});
  $('resultBox').style.display='none'; $('saveStatus').style.display='none'; startTime=Date.now(); window.scrollTo({top:0,behavior:'smooth'});
}
function exportCSV(){
  let rs=getRecords().filter(r=>r.set===SET_NAME);if(!rs.length){alert('Belum ada rekod.');return;}
  let rows=[['Tarikh','Set','Kelas','Nama','Markah','Jumlah','Peratus','Masa(s)','Percubaan'],...rs.map(r=>[r.ts,r.set,r.class,r.name,r.score,r.total,r.percent,r.seconds,r.attempt])];
  let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rekod_uasa_t1_revision_2023.csv';a.click();URL.revokeObjectURL(a.href);
}
init();
</script>
