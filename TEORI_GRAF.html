AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/2Q=="}, {"title": "Selangor Set 2 Paper 2 • 17(a)", "body": "\n      <p>Syan merupakan seorang pekerja pengutip sisa kitar semula. Setiap hari, beliau perlu mengunjungi semua rumah bermula dari rumah A hingga ke rumah E untuk mengutip barangan yang boleh dikitar semula. Bagi menjimatkan masa, Syan ingin memilih laluan rumah dengan jarak minimum dan tidak melalui rumah yang sama lebih daripada sekali.</p>\n      <table><tr><th>Pasangan bucu</th><th>Jarak (m)</th></tr><tr><td>(A,D)</td><td>425</td></tr><tr><td>(A,B)</td><td>390</td></tr><tr><td>(A,C)</td><td>420</td></tr><tr><td>(B,C)</td><td>300</td></tr><tr><td>(C,D)</td><td>250</td></tr><tr><td>(D,E)</td><td>375</td></tr><tr><td>(C,E)</td><td>325</td></tr><tr><td>(B,E)</td><td>450</td></tr></table>\n      <div class=\"part\">(i) Menggunakan maklumat dalam Jadual 7, lengkapkan Rajah 16 dengan melukis graf berpemberat dengan jarak minimum di mana setiap rumah dilawati sekali sahaja.</div>\n      <div class=\"graph-answer\" data-gid=\"sel2_17\">\n      <div class=\"graph-title\">Jawapan (i) • Rajah 16</div>\n      <div class=\"graph-help\">Bucu telah disediakan. Tekan bucu pertama → bucu kedua. Ulang pasangan sama untuk multiple edge. Tekan bucu yang sama dua kali untuk loop.</div>\n      <div class=\"graph-area\"><svg></svg></div>\n      <div class=\"graph-actions\">\n        <button type=\"button\" class=\"undo\">↶ Undur</button>\n        <button type=\"button\" class=\"clear\">Padam graf</button>\n      </div>\n    </div>\n      <div class=\"part\">(ii) Seterusnya, hitung jarak terpendek, dalam m.</div>\n      <div class=\"answers\"><div class=\"field\">\n      <label>(ii) Jarak terpendek</label>\n      <input class=\"final-input\" data-key=\"sel217_dist\" data-answers='[ const inputState={};
const graphState={};
let current=0,currentName="",currentClass="",submitted=false,deadline=0,timerId=null;

function init(){
  const cls=[...new Set(students.map(s=>s.class))].sort();
  kelas.innerHTML='<option value="">-- Pilih kelas --</option>'+cls.map(c=>`<option>${c}</option>`).join('');
}
kelas.onchange=()=>{
  const list=students.filter(s=>s.class===kelas.value).sort((a,b)=>a.name.localeCompare(b.name));
  nama.innerHTML='<option value="">-- Pilih nama --</option>'+list.map(s=>`<option>${s.name}</option>`).join('');
};
function norm(v){return String(v??"").trim().toLowerCase().replace(/\s+/g," ").replace(/[{}]/g,"").replace(/→/g,"-").replace(/\s*-\s*/g,"-");}
function matches(v, answers){
  if(!answers || !answers.length) return null;
  const nv=norm(v);
  return answers.some(a=>norm(a)===nv);
}
function saveInputs(){
  content.querySelectorAll(".final-input").forEach(x=>inputState[x.dataset.key]=x.value);
}
function ensureGraph(gid){
  if(!graphState[gid]) graphState[gid]={selected:null,edges:[],history:[]};
  return graphState[gid];
}
function drawGraph(box,gid){
  const cfg=graphCfg[gid],s=ensureGraph(gid),area=box.querySelector(".graph-area"),svg=area.querySelector("svg");
  area.querySelectorAll(".dot,.dotlabel,.weight-wrap,.edge-name-wrap").forEach(x=>x.remove());
  const counts={}; s.edges.forEach(e=>{const k=[e.a,e.b].sort((a,b)=>a-b).join("-");counts[k]=(counts[k]||0)+1;});
  let seen={},paths="",arrows="";
  function pt(i){const n=cfg.nodes[i],w=area.clientWidth,h=area.clientHeight;return {x:n[1]/100*w,y:n[2]/100*h,label:n[0]};}
  function arrowMark(x,y,angle){return `<g transform="translate(${x} ${y}) rotate(${angle})"><path class="edge-arrow" d="M -7 -5 L 0 0 L -7 5"/></g>`;}
  function addWeight(edge,x,y){
    const wrap=document.createElement("div");
    wrap.className="weight-wrap";
    wrap.style.left=x+"px";
    wrap.style.top=y+"px";
    if(submitted){
      const lab=document.createElement("div");
      lab.className="weight-label";
      lab.textContent=(edge.w??"") || "?";
      wrap.appendChild(lab);
    }else{
      const inp=document.createElement("input");
      inp.type="text";
      inp.inputMode="decimal";
      inp.className="weight-input";
      inp.placeholder="w";
      inp.value=edge.w??"";
      inp.oninput=()=>edge.w=inp.value;
      wrap.appendChild(inp);
    }
    area.appendChild(wrap);
  }

  function addEdgeName(edge,x,y){
    const wrap=document.createElement("div");
    wrap.className="edge-name-wrap";
    wrap.style.left=x+"px";
    wrap.style.top=y+"px";
    if(submitted){
      const lab=document.createElement("div");
      lab.className="edge-name-label";
      lab.textContent=(edge.label??"") || "?";
      wrap.appendChild(lab);
    }else{
      const inp=document.createElement("input");
      inp.type="text";
      inp.className="edge-name-input";
      inp.placeholder=cfg.edgeLabelPlaceholder||"Nama";
      inp.value=edge.label??"";
      inp.oninput=()=>edge.label=inp.value;
      wrap.appendChild(inp);
    }
    area.appendChild(wrap);
  }
  s.edges.forEach(e=>{
    const a=pt(e.a),b=pt(e.b),k=[e.a,e.b].sort((x,y)=>x-y).join("-");
    seen[k]=(seen[k]||0); const idx=seen[k]++, count=counts[k];
    if(e.a===e.b){
      const size=22+idx*8,rx=size,ry=Math.max(15,size-7),cx=a.x+size-2,cy=a.y-size+5;
      paths+=`<ellipse class="edge" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(-25 ${a.x} ${a.y})"/>`;
      if(cfg.directed) arrows+=arrowMark(cx+rx*0.28,cy-ry*0.55,-35);
      if(cfg.weighted) addWeight(e,cx,cy-ry-22);
      if(cfg.edgeLabels) addEdgeName(e,cx,cy-ry-26);
    } else {
      const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,angle=Math.atan2(dy,dx)*180/Math.PI;
      if(count===1){
        paths+=`<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        if(cfg.directed) arrows+=arrowMark(mx,my,angle);
        if(cfg.weighted) addWeight(e,mx+nx*30,my+ny*30);
        if(cfg.edgeLabels) addEdgeName(e,mx+nx*24,my+ny*24);
      } else {
        const kk=idx-(count-1)/2,curve=30*Math.sign(kk||1)*Math.max(1,Math.abs(kk)),mx=(a.x+b.x)/2+nx*curve,my=(a.y+b.y)/2+ny*curve;
        paths+=`<path class="edge" d="M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}"/>`;
        const qx=(a.x+2*mx+b.x)/4,qy=(a.y+2*my+b.y)/4;
        if(cfg.directed) arrows+=arrowMark(qx,qy,angle);
        if(cfg.weighted) addWeight(e,qx+nx*28,qy+ny*28);
        if(cfg.edgeLabels) addEdgeName(e,qx+nx*24,qy+ny*24);
      }
    }
  });
  svg.innerHTML=paths+arrows;
  cfg.nodes.forEach((n,i)=>{
    const p=pt(i),d=document.createElement("div");
    d.className="dot"+(s.selected===i?" sel":""); d.style.left=p.x+"px"; d.style.top=p.y+"px";
    d.onclick=()=>{ 
      if(submitted)return; 
      if(s.selected===null)s.selected=i; 
      else{
        const edge={a:s.selected,b:i};
        if(cfg.weighted) edge.w="";
        if(cfg.edgeLabels) edge.label="";
        s.edges.push(edge);
        s.history.push(1);
        s.selected=null;
      }
      drawGraph(box,gid); 
    };
    area.appendChild(d);
    const l=document.createElement("div"); l.className="dotlabel"; l.textContent=n[0]; l.style.left=(p.x+18)+"px"; l.style.top=(p.y-12)+"px"; area.appendChild(l);
  });
  box.querySelector(".undo").onclick=()=>{if(submitted)return;if(s.history.length){s.history.pop();s.edges.pop();s.selected=null;drawGraph(box,gid);}};
  box.querySelector(".clear").onclick=()=>{if(submitted)return;s.edges=[];s.history=[];s.selected=null;drawGraph(box,gid);};
}
function render(){
  if(content.innerHTML) saveInputs();
  const item=items[current];
  title.textContent=item.title;
  counter.textContent=`${current+1} / ${items.length}`;
  content.innerHTML=`<div class="question">${item.body}${submitted&&item.customScheme?item.customScheme:''}${item.scheme?`<div class="scheme" style="display:${submitted?'block':'none'}"><div class="scheme-title">Skema jawapan asal</div><img src="${item.scheme}" alt="Skema"></div>`:''}</div>`;
  content.querySelectorAll(".final-input").forEach(x=>{
    x.value=inputState[x.dataset.key] ?? "";
    const label=x.parentElement.querySelector("label");
    if(label && /laluan/i.test(label.textContent)){
      const pad=document.createElement("div");
      pad.className="arrow-keypad";
      ["→","←","↔"].forEach(sym=>{
        const b=document.createElement("button");
        b.type="button";
        b.textContent=sym;
        b.onclick=()=>{
          if(submitted)return;
          const start=x.selectionStart??x.value.length,end=x.selectionEnd??start;
          x.value=x.value.slice(0,start)+sym+x.value.slice(end);
          inputState[x.dataset.key]=x.value;
          x.focus();
          x.setSelectionRange(start+sym.length,start+sym.length);
        };
        pad.appendChild(b);
      });
      x.parentElement.appendChild(pad);
    }
    if(submitted){
      x.disabled=true;
      let ans=[];
      try{ans=JSON.parse(x.dataset.answers||"[]");}catch(e){}
      const ok=matches(x.value,ans);
      if(ok!==null){
        x.classList.add(ok?"ok":"bad");
        if(!ok && ans.length){
          const d=document.createElement("div"); d.className="correct-answer"; d.textContent="Jawapan betul: "+ans[0]; x.parentElement.appendChild(d);
        }
      }
    }
  });
  content.querySelectorAll(".graph-answer").forEach(box=>{
    const cfg=graphCfg[box.dataset.gid]||{};
    const help=box.querySelector(".graph-help");
    if(help){
      const msg=["Bucu telah disediakan. Tekan bucu pertama kemudian bucu kedua."];
      if(cfg.directed) msg.push("Anak panah akan dipaparkan di tengah garisan.");
      if(cfg.weighted) msg.push("Kotak pemberat akan muncul sedikit di atas garisan supaya tidak menutup anak panah.");
      if(cfg.edgeLabels) msg.push("Kotak nama murid akan muncul pada setiap garis tepi. Isikan nama murid yang menghubungkan dua buah tersebut.");
      msg.push("Ulang pasangan sama untuk multiple edge. Tekan bucu yang sama dua kali untuk loop.");
      help.textContent=msg.join(" ");
    }
    drawGraph(box,box.dataset.gid);
    if(submitted) box.querySelectorAll("button,.weight-input,.edge-name-input").forEach(b=>b.disabled=true);
  });
  prevBtn.disabled=current===0; nextBtn.disabled=current===items.length-1; content.scrollTop=0;
}
prevBtn.onclick=()=>{if(current>0){saveInputs();current--;render();}};
nextBtn.onclick=()=>{if(current<items.length-1){saveInputs();current++;render();}};
startBtn.onclick=()=>{
  currentClass=kelas.value;currentName=nama.value;
  if(!currentClass||!currentName)return alert("Pilih kelas dan nama dahulu.");
  login.classList.add("hidden");app.classList.remove("hidden");studentPill.textContent=currentName;classPill.textContent=currentClass;render();
  deadline=Date.now()+3600*1000;
  timerId=setInterval(()=>{
    if(submitted)return;
    const l=Math.max(0,Math.ceil((deadline-Date.now())/1000));
    timer.textContent=String(Math.floor(l/60)).padStart(2,"0")+":"+String(l%60).padStart(2,"0");
    if(l<=0)submitAll(true);
  },500);
};
async function submitAll(auto){
  if(submitted)return;
  saveInputs(); submitted=true; clearInterval(timerId);
  let checked=0,correct=0,filled=0,totalFields=0;
  items.forEach(()=>{});
  document.querySelectorAll(".final-input").forEach(()=>{});
  Object.values(inputState).forEach(v=>{totalFields++;if(String(v).trim())filled++;});
  // evaluate every stored field using source definitions
  items.forEach(it=>{
    const tmp=document.createElement("div"); tmp.innerHTML=it.body;
    tmp.querySelectorAll(".final-input").forEach(x=>{
      let ans=[]; try{ans=JSON.parse(x.dataset.answers||"[]");}catch(e){}
      if(ans.length){checked++; if(matches(inputState[x.dataset.key]??"",ans))correct++;}
    });
  });
  try{
    await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      name:currentName,class:currentClass,set:"TEORI GRAF SEMUA SOALAN 2026",
      score:correct,total:checked,pct:checked?Math.round(correct/checked*100):0,timed_out:auto
    })});
  }catch(e){}
  render();
  alert(auto?"Masa tamat. Jawapan telah dihantar dan skema dipaparkan.":"Jawapan telah dihantar. Gunakan Sebelum/Seterusnya untuk melihat semakan dan skema.");
}
submitBtn.onclick=()=>submitAll(false);
init();
</script>
