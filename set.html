*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#1f2937}
.wrap{max-width:980px;margin:22px auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 10px 28px rgba(0,0,0,.08)}

.notice{background:#f0fdf4;color:#166534;padding:13px 15px;border-radius:12px;margin:16px 0;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-weight:800;margin:12px 0 6px}
select,input{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:15px;text-align:center}
.primary,.secondary{border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer}
.primary{background:#166534;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.topbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;font-weight:800;color:#475467}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress div{height:100%;background:#16a34a}
.qtext{line-height:1.6;margin-bottom:10px}.en{font-style:italic;color:#6b7280}
.data-table{width:100%;border-collapse:collapse;margin:14px 0}
.data-table th,.data-table td{border:1px solid #9ca3af;padding:8px;text-align:center;font-size:14px}
.data-table th{background:#f3f4f6}
.part{margin-top:20px;padding-top:16px;border-top:1px solid #e5e7eb}
.part-title{font-weight:800;line-height:1.5}.marks{float:right;color:#166534}
.venn-wrap{position:relative;max-width:650px;margin:16px auto;background:#fff;border:1px solid #cbd5e1;border-radius:14px;overflow:hidden}
.venn-wrap svg{display:block;width:100%;height:auto}
.region-input{position:absolute;width:58px!important;padding:6px!important;font-weight:800;background:#fff;border:2px solid #94a3b8!important}
.rA{left:21%;top:31%}.rB{right:21%;top:31%}.rC{left:46%;top:72%}
.rAB{left:46%;top:27%}.rAC{left:35%;top:51%}.rBC{right:35%;top:51%}.rABC{left:50%;top:48%;transform:translate(-50%,-50%);background:#fff7ed!important;border-color:#f59e0b!important}
.rNone{left:8%;top:82%;background:#fef2f2!important;border-color:#ef4444!important}
.answer-small{max-width:220px}
.feedback{margin-top:8px;min-height:20px;font-size:14px}.ok{color:#047857;font-weight:800}.bad{color:#b42318;font-weight:800}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.center{text-align:center}.score{font-size:52px;font-weight:900;color:#166534}
@media(max-width:650px){.row{grid-template-columns:1fr}.region-input{width:48px!important;font-size:12px}.marks{float:none;display:block;margin-top:4px}h1{font-size:25px}}

.attempt-status{margin:14px 0;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;display:none}
.attempt-status.ok{display:block;background:#ecfdf3;color:#047857}
.attempt-status.locked{display:block;background:#fef2f2;color:#b42318}

</style>

function loadNames(){
  selectedClass=document.getElementById("classSel").value;
  const list=students.filter(s=>s.class===selectedClass).sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById("nameSel").innerHTML='<option value="">-- Pilih nama --</option>'+list.map(s=>`<option>${s.name}</option>`).join("");
  selectedStudent="";
  const st=document.getElementById("attemptStatus");
  if(st){st.className="attempt-status";st.textContent="";}
  document.getElementById("startBtn").disabled=true;
}
function toggleStart(){
  selectedStudent=document.getElementById("nameSel").value;
  document.getElementById("startBtn").disabled=!(selectedClass&&selectedStudent);
}

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"));},10000);
    function cleanup(){clearTimeout(timer);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=(data)=>{cleanup();resolve(data);};
    s.onerror=()=>{cleanup();reject(new Error("network"));};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
    document.body.appendChild(s);
  });
}

async function checkEligibility(){
  selectedStudent=document.getElementById("nameSel").value;
  const status=document.getElementById("attemptStatus");
  const startBtn=document.getElementById("startBtn");
  startBtn.disabled=true;
  status.className="attempt-status";
  status.textContent="";
  if(!selectedClass||!selectedStudent)return;
  if(!WEB_APP_URL||WEB_APP_URL.startsWith("PASTE_")){
    status.className="attempt-status ok";
    status.textContent="Sistem semakan percubaan belum disambungkan. Masukkan Web App URL.";
    startBtn.disabled=false;
    return;
  }
  status.className="attempt-status ok";
  status.textContent="Menyemak rekod percubaan...";
  try{
    const url=WEB_APP_URL+"?action=check_attempt&name="+encodeURIComponent(selectedStudent)+"&class="+encodeURIComponent(selectedClass)+"&topic="+encodeURIComponent("Praktis Set - Rajah Venn");
    const data=await jsonp(url);
    if(data.allowed){
      status.className="attempt-status ok";
      status.textContent=data.retake?"Kebenaran guru dikesan. Anda dibenarkan menjawab semula sekali.":"Anda belum menjawab latihan ini. Anda boleh mula.";
      startBtn.disabled=false;
    }else{
      status.className="attempt-status locked";
      status.innerHTML="Anda telah menjawab latihan ini. <b>Percubaan kedua dikunci.</b> Sila dapatkan kebenaran guru jika perlu menjawab semula.";
      startBtn.disabled=true;
    }
  }catch(e){
    status.className="attempt-status locked";
    status.textContent="Semakan rekod tidak berjaya. Sila maklumkan kepada guru.";
    startBtn.disabled=true;
  }
}

    <div class="qtext en">${q.context_en}</div>

    <table class="data-table">
      <thead><tr><th>Maklumat / Information</th><th>Bilangan / Number</th></tr></thead>
      <tbody>${q.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody>
    </table>

    <div class="part">
      <div class="part-title">
        (i) Menggunakan maklumat dalam jadual, lengkapkan gambar rajah Venn termasuk rantau di luar ketiga-tiga set.
        <br><span class="en">Using the information in the table, complete the Venn diagram including the region outside all three sets.</span>
        <span class="marks">[2 markah / marks]</span>
      </div>
      ${vennHTML(q)}
      <div id="fb1" class="feedback"></div>
    </div>

    <div class="part">
      <div class="part-title">
        (ii) Tunjukkan pengiraan bagi bilangan responden yang tidak berada dalam mana-mana set.
        <br><span class="en">Show the calculation for the number of respondents who are not represented in any set.</span>
        <span class="marks">[2 markah / marks]</span>
      </div>
      <div class="answer-small"><input id="noneAns" inputmode="numeric" placeholder="Jawapan akhir"></div>
      <div id="fb2" class="feedback"></div>
    </div>

    <div class="part">
      <div class="part-title">
        (iii) Nyatakan bilangan responden yang diwakili oleh <b>${q.part3_expr}</b>.
        <br><span class="en">State the number of respondents represented by <b>${q.part3_expr}</b>.</span>
        <span class="marks">[1 markah / mark]</span>
      </div>
      <div class="answer-small"><input id="part3Ans" inputmode="numeric" placeholder="Jawapan"></div>
      <div id="fb3" class="feedback"></div>
    </div>

    <div class="actions">
      <button id="checkBtn" class="primary" onclick="checkQuestion()">Semak Soalan</button>
      <button id="nextBtn" class="primary" style="display:none" onclick="nextQuestion()">${qIndex===4?"Hantar Markah":"Soalan Seterusnya →"}</button>
    </div>`;
}

function n(id){
  const v=parseFloat(document.getElementById(id).value);
  return Number.isFinite(v)?v:null;
}
function same(a,b){return a!==null && Math.abs(a-b)<1e-9;}
function show(id,ok,msg){
  const el=document.getElementById(id);
  el.className="feedback "+(ok?"ok":"bad");
  el.textContent=ok?"✓ Betul":"✗ "+msg;
}

function checkQuestion(){
  if(locked)return;
  const q=questions[qIndex];
  let score=0;

  const keys=["Aonly","Bonly","Conly","AB","AC","BC","ABC"];
  const correctCount=keys.filter(k=>same(n(k),q.regions[k])).length;
  const outsideCorrect = same(n("NONE"), q.none);

  let part1=0;
  if(correctCount===7 && outsideCorrect) part1=2;
  else if(correctCount>=4 || outsideCorrect) part1=1;
  score+=part1;
  show("fb1",part1===2,part1===1?"Sebahagian rajah betul. Semak semula baki rantau.":"Semak nilai dalam setiap rantau Rajah Venn.");

  const part2=same(n("noneAns"),q.none);
  if(part2)score+=2;
  show("fb2",part2,"Gunakan jumlah keseluruhan tolak bilangan dalam kesatuan tiga set.");

  const part3=same(n("part3Ans"),q.part3);
  if(part3)score+=1;
  show("fb3",part3,"Kenal pasti rantau yang mewakili ungkapan set tersebut.");

  perQuestionScores[qIndex]=score;
  totalScore+=score;
  locked=true;
  document.querySelectorAll("input").forEach(x=>x.disabled=true);
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-block";
}

function nextQuestion(){qIndex++;if(qIndex<5)renderQuestion();else submitResult();}

async function submitResult(){
  const percent=Math.round(totalScore/25*100);
  const duration=Math.round((new Date()-startTime)/1000);
  const payload={
    type:"set_quiz",
    name:selectedStudent,class:selectedClass,
    q1:perQuestionScores[0],q2:perQuestionScores[1],q3:perQuestionScores[2],q4:perQuestionScores[3],q5:perQuestionScores[4],
    total_score:totalScore,total:25,percent:percent,
    duration_seconds:duration,topic:"Praktis Set - Rajah Venn"
  };

  let sent=false;
  if(WEB_APP_URL && !WEB_APP_URL.startsWith("PASTE_")){
    try{
      await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});
      sent=true;
    }catch(e){}
  }

  document.getElementById("app").innerHTML=`
    <div class="center">
      <span class="badge">SELESAI</span>
      <h1>Praktis Set Selesai</h1>
      <div class="score">${totalScore} / 25</div>
      <h2>${percent}%</h2>
      <p class="sub">${sent?"Markah telah dihantar. Percubaan ini kini dikunci.":"Markah telah dikira. Masukkan Web App URL Matriks yang sama untuk menyimpan rekod."}</p>
      <button class="primary" onclick="renderLogin()">Kembali</button>
    </div>`;
}
renderLogin();
</script>
</body>
</html>
